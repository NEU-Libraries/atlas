require: rubocop-rails
AllCops:
  NewCops: enable
  Exclude:
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'db/**/*'
    - 'bin/**/*'
    - 'config/**/*'
    # Template naturally long
    - 'app/lib/mods_builder.rb'
    - 'app/lib/mets_builder.rb'
Lint/MissingSuper:
  Exclude:
    - 'app/services/**/*'
Metrics/ClassLength:
  Max: 120
  Exclude:
    # OCFL 1.1 write-path coordination naturally long; broken into private
    # helpers but the class itself stays a single coherent boundary.
    - 'app/lib/valkyrie/storage/ocfl.rb'
    # The single auth gate every request passes through: rescue_from handlers
    # plus four credential paths (cerberus_token, system_token, devise-jwt,
    # Cerberus signed assertion). Cohesive by design — already decomposed into
    # small private resolvers. Candidate for a TokenAuthentication concern if it
    # grows further; tracked as a follow-up refactor.
    - 'app/controllers/application_controller.rb'
    # The Files resource controller: the full binary surface (index/show/
    # create/replace/versions/version_content/rollback/destroy/content/
    # ancestry) plus its file-audit helpers. Cohesive by resource and already
    # decomposed into small private methods; the bytes-on-disk operations
    # belong together.
    - 'app/controllers/blobs_controller.rb'
Metrics/ModuleLength:
  Exclude:
    # Flat schema-definition map — length tracks the OpenAPI surface, not
    # logic worth decomposing.
    - 'spec/support/openapi_schemas.rb'
Metrics/AbcSize:
  Max: 30
  Exclude:
    - 'app/decorators/*'
    - 'app/lib/mods_decoration.rb'
    - 'app/services/**/*'
    # Nature of object conversion, lots of assignment
    - 'app/lib/mods_to_json.rb'
    - 'app/lib/valkyrie/storage/ocfl.rb'
Metrics/CyclomaticComplexity:
  Exclude:
    - 'app/decorators/*'
    - 'app/lib/valkyrie/storage/ocfl.rb'
Metrics/PerceivedComplexity:
  Exclude:
    - 'app/decorators/*'
Metrics/ParameterLists:
  Exclude:
    - 'app/lib/valkyrie/storage/ocfl.rb'
    - 'app/lib/valkyrie/storage/ocfl/inventory.rb'
    # Service initializers take a keyword arg per resource attribute they
    # set; mirrors the AbcSize/MissingSuper service carve-outs above.
    - 'app/services/**/*'
Lint/AmbiguousBlockAssociation:
  Enabled: false
Rails/FindEach:
  Enabled: false
Rails/I18nLocaleTexts:
  Enabled: false
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Max: 120
  Include:
    - 'app/**/*'
Metrics/MethodLength:
  Max: 15
  AllowedMethods: ['role_permissions', 'convert_xml_to_json', 'apply_role_abilities', 'seed_fixture_users!']
  Exclude:
    - 'app/lib/valkyrie/storage/ocfl.rb'
    - 'app/lib/valkyrie/storage/ocfl/inventory.rb'
    - 'app/lib/valkyrie/storage/ocfl/storage_root.rb'
    # Flat schema-definition maps (one method per OpenAPI component) — length
    # tracks the API surface, not logic worth decomposing.
    - 'spec/support/openapi_schemas.rb'
Metrics/BlockLength:
  Exclude:
    # BL config too long
    - 'app/controllers/catalog_controller.rb'
    - 'spec/**/*'
    - 'lib/tasks/*'
Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test
    - staging
Rails/DynamicFindBy:
  Whitelist:
    - find_by_alternate_identifier
Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table
Style/MissingRespondToMissing:
  Enabled: false
Style/HashEachMethods:
  Enabled: true
Style/HashTransformKeys:
  Enabled: true
Style/HashTransformValues:
  Enabled: true
Naming/VariableNumber:
  Enabled: false
Lint/EmptyBlock:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  Enabled: false
