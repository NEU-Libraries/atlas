# The Stage 1 rule set. The rules marked `error` are the ones the gate counts:
# each one breaks the document, breaks a generated client, or breaks a contract
# Atlas already states in prose. Every other spectral:oas rule is a `warn`,
# reported and never counted. docs/openapi.md says why each rule is here.
extends: [[spectral:oas, all]]

functions: [errorSchema, securedHas401, noAuthorizationHeader, jsonExample]
functionsDir: functions

rules:
  oas3-schema: error
  oas3-valid-schema-example: error
  oas3-valid-media-example: error
  no-$ref-siblings: error
  typed-enum: error
  path-params: error
  operation-operationId: error
  operation-operationId-unique: error

  atlas-4xx-uses-error-schema:
    description: A 4xx response with a body must reference the shared Error schema.
    severity: error
    message: '{{error}}'
    resolved: false
    given: $.paths[*][get,put,post,patch,delete,head,options].responses
    then:
      function: errorSchema

  atlas-secured-operation-documents-401:
    description: An operation that accepts a credential must document its 401.
    severity: error
    message: '{{error}}'
    resolved: false
    given: $
    then:
      function: securedHas401

  atlas-no-authorization-parameter:
    description: Authorization is declared through security, never as a header parameter.
    severity: error
    message: '{{error}}'
    given: $.paths[*]
    then:
      function: noAuthorizationHeader

  atlas-2xx-json-has-example:
    description: A 2xx JSON response must carry an example.
    severity: error
    message: '{{error}}'
    resolved: false
    given: $.paths[*][get,put,post,patch,delete,head,options].responses
    then:
      function: jsonExample

  # Uncounted. Listed so their default severity cannot make them count.
  operation-success-response: warn
  operation-parameters: warn
  operation-tag-defined: warn
  contact-properties: warn
  duplicated-entry-in-enum: warn
  info-contact: warn
  info-description: warn
  info-license: warn
  license-url: warn
  no-eval-in-markdown: warn
  no-script-tags-in-markdown: warn
  openapi-tags-alphabetical: warn
  openapi-tags-uniqueness: warn
  openapi-tags: warn
  operation-description: warn
  operation-operationId-valid-in-url: warn
  operation-singular-tag: warn
  operation-tags: warn
  path-declarations-must-exist: warn
  path-keys-no-trailing-slash: warn
  path-not-include-query: warn
  tag-description: warn
  array-items: warn
  oas3-api-servers: warn
  oas3-examples-value-or-externalValue: warn
  oas3-operation-security-defined: warn
  oas3-parameter-description: warn
  oas3-server-not-example.com: warn
  oas3-server-trailing-slash: warn
  oas3-unused-component: warn
  oas3-server-variables: warn
  oas3-callbacks-in-callbacks: warn
