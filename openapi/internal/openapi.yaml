  "/resources/{id}/reindex":
    parameters:
    - name: id
      in: path
      description: NOID of any resource
      required: true
      schema:
        type: string
    post:
      summary: Re-project a resource's Solr doc (system-only)
      tags:
      - Resources
      description: |
        Operational, **system-gated** Solr re-projection. Re-derives the
        resource's Solr doc from the current Postgres/OCFL source of truth — no
        lifecycle transition, no audit event, no optimistic-lock bump. This is
        the supported lever after an indexer ships or changes (e.g.
        `classification_ssim`) and an already-finalized resource carries a
        stale/empty projection; previously the only option was to abuse a
        lifecycle transition (`POST /works/{id}/complete`). Idempotent.

        Requires the system bearer token paired with the system `User:` NUID
        header; any non-system caller is rejected (401/403). Unknown id → 404.
      responses:
        '204':
          description: resource re-projected from current state
        '404':
          description: unknown id
        '403':
          description: non-system caller is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_reindex
  "/resources/{id}/reindex_subtree":
    parameters:
    - name: id
      in: path
      description: NOID of any resource (subtree root)
      required: true
      schema:
        type: string
    post:
      summary: Re-project a resource and its full descendant subtree (system-only)
      tags:
      - Resources
      description: |
        Operational, **system-gated** subtree Solr re-projection. Gathers the
        resource plus its full descendant subtree — descendant containers
        (Collection/Community) **and the Works beneath them**, a deliberate
        superset of the re-parent cascade so Work-level projections like
        `classification_ssim` refresh too — and re-derives each doc from the
        current Postgres/OCFL source of truth (no lifecycle/audit/lock bump).

        Rooted at a Collection it refreshes that Collection's contents; rooted
        at the top Community it backfills the whole repository. **Synchronous**
        by design — for a pathologically large subtree the caller roots lower or
        drives the cascade in chunks. Idempotent. Returns the count re-projected.
        Non-system callers are rejected (401/403); unknown id → 404.
      responses:
        '200':
          description: subtree re-projected; descendant Works refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reindexed:
                    type: integer
                required:
                - reindexed
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_reindex_subtree
  "/resources/{id}/search_explanation":
    get:
      summary: How the catalog search scores one object
      tags:
      - Resources
      description: |
        Solr's own account of how the catalog search scores one Work, Collection
        or Community for `q`, whether it matches or not, for debugging search.
        Admins and delegated admins only; a delegated admin must also be able to
        read the object.

        `explanation` is Solr's structured `explainOther` tree, unchanged.
        `handler` is the search handler's `qf`, `pf`, `mm`, `tie` and `boost`,
        read from Solr. `hidden_by` names the always-on catalog filters that
        hide the object whatever it matches.

        `fields` has one entry per `qf` field. Each stored value that feeds the
        field is analysed against `q`, and its index tokens carry `match`.
        Offsets count UTF-16 code units, as Solr reports them. A field with no
        stored text says why in `reason`: `not_stored`, or `full_text`, whose
        matching passages are in `highlights`. A failed analysis is
        `analysis_failed`; the other fields are still returned.

        400 for a blank `q`. 404 for an unknown NOID, a Set or any other type;
        404 with `error: not_indexed` when Solr holds no document for the
        object. 502 when Solr does not answer.
      parameters:
      - name: id
        in: path
        description: NOID
        required: true
        schema:
          type: string
      - name: q
        in: query
        required: true
        description: The search words
        schema:
          type: string
      responses:
        '200':
          description: the object does not match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchExplanation"
        '400':
          description: blank q
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: the object has no Solr document
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: search_explanations_show
  "/nuid":
    post:
      summary: Mint a JWT for a NUID (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus (post-SSO) to mint a personal-
        access JWT for a user. The librarian then uses the token directly
        against Atlas (Authorization: Bearer …) from scripts. Tokens carry a
        1-week TTL. Requires the system Bearer token; non-system callers
        receive 403. An unknown NUID returns 404. Emits a mint_token audit row.
        An optional `read_only: true` mints a token that can only reach the
        read-shaped actions in `ApplicationController::READ_ONLY_TOKEN_ACTIONS`,
        however much more the underlying user may do. Within that list the
        user's own tier still applies, so an operator read such as
        `GET /works/{id}/health_check` answers only an admin's token. It is the
        shape to hand to a non-human caller (e.g. an MCP client) that must
        never be able to mutate the repository.
      parameters: []
      responses:
        '200':
          description: read-only token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
        '403':
          description: caller is not the system user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                email:
                  type: string
                  description: Optional — disambiguate which account under the NUID
                    when it holds several.
                read_only:
                  type: boolean
                  description: Optional — mint a token restricted to read-shaped actions
                    only.
              required:
              - nuid
      operationId: users_tokens_nuid
    delete:
      summary: Revoke all of a user's tokens (system-only)
      tags:
      - User
      description: |
        System-only endpoint that revokes every outstanding token for a user
        by rotating its jti (single-token model → all-or-nothing). Cerberus's
        "regenerate token" is a revoke followed by a fresh mint. Requires the
        system Bearer token; non-system callers receive 403. An unknown NUID
        returns 404. Emits a revoke_token audit row.
      parameters: []
      responses:
        '204':
          description: tokens revoked
        '403':
          description: caller is not the system user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                email:
                  type: string
                  description: Optional — disambiguate which account under the NUID
                    when it holds several.
              required:
              - nuid
      operationId: users_tokens_revoke
  "/users/by_nuid/{nuid}":
    put:
      summary: Find-or-create a user and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Idempotent
        on NUID; replaces (not merges) the supplied groups onto the user.
        Requires the system Bearer token (no `User:` header); non-system
        callers receive 403.
