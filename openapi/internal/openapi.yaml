  "/nuid":
    post:
      summary: Mint a JWT for a NUID (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus (post-SSO) to mint a personal-
        access JWT for a user. The librarian then uses the token directly
        against Atlas (Authorization: Bearer …) from scripts. Tokens carry a
        1-week TTL. Requires the system Bearer token; non-system callers
        receive 403. An unknown NUID returns 404. Emits a mint_token audit row.
        An optional `read_only: true` mints a token that can only reach the
        read-shaped actions in `ApplicationController::READ_ONLY_TOKEN_ACTIONS`,
        however much more the underlying user may do. Within that list the
        user's own tier still applies, so an operator read such as
        `GET /works/{id}/health_check` answers only an admin's token. It is the
        shape to hand to a non-human caller (e.g. an MCP client) that must
        never be able to mutate the repository.
      parameters: []
      responses:
        '200':
          description: The new JWT, read-only when `read_only` was true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
              example:
                token: "<redacted>"
        '403':
          description: The caller is neither the system user nor an admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                email:
                  type: string
                  description: Optional — disambiguate which account under the NUID
                    when it holds several.
                read_only:
                  type: boolean
                  description: Optional — mint a token restricted to read-shaped actions
                    only.
              required:
              - nuid
      operationId: users_tokens_nuid
    delete:
      summary: Revoke all of a user's tokens (system-only)
      tags:
      - User
      description: |
        System-only endpoint that revokes every outstanding token for a user
        by rotating its jti (single-token model → all-or-nothing). Cerberus's
        "regenerate token" is a revoke followed by a fresh mint. Requires the
        system Bearer token; non-system callers receive 403. An unknown NUID
        returns 404. Emits a revoke_token audit row.
      parameters: []
      responses:
        '204':
          description: Every token the user held is revoked.
        '403':
          description: The caller is neither the system user nor an admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                email:
                  type: string
                  description: Optional — disambiguate which account under the NUID
                    when it holds several.
              required:
              - nuid
      operationId: users_tokens_revoke
  "/users/by_nuid/{nuid}":
    put:
      summary: Find-or-create a user and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Idempotent
        on NUID; replaces (not merges) the supplied groups onto the user.
        Requires the system Bearer token (no `User:` header); non-system
        callers receive 403.
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
        description: The person's NUID.
      responses:
        '200':
          description: The user, found or created, with the supplied groups.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
              example:
                user:
                  id: 1
                  nuid: '001234567'
                  name: Jane Doe
                  email: person1@example.org
                  role: standard
                  groups:
                  - northeastern:staff
                  - drs:editors
                  affiliation:
                  preferred: false
        '403':
          description: The caller is neither the system user nor an admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    type: string
                email:
                  type: string
                name:
                  type: string
      operationId: users_update
  "/users/by_email/{email}":
    put:
      summary: Find-or-create a user by email and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Email is the
        account key, so a person's staff and student logins (same NUID,
        different email) provision as distinct accounts instead of collapsing
        on NUID. Idempotent on email; replaces (not merges) the supplied groups.
        Requires the system Bearer token; non-system callers receive 403.
      parameters:
      - name: email
        in: path
        description: The account key (email).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The user, found or created, with the supplied groups.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
              example:
                user:
                  id: 1
                  nuid: '001234567'
                  name: Jane Doe
                  email: person1@example.org
                  role: standard
                  groups:
                  - northeastern:staff
                  affiliation: staff
                  preferred: false
        '403':
          description: The caller is neither the system user nor an admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                groups:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                affiliation:
                  type: string
                  description: unscoped-affiliation, a human account label
      operationId: users_update_by_email
