  "/users/by_email/{email}":
    put:
      summary: Find-or-create a user by email and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Email is the
        account key, so a person's staff and student logins (same NUID,
        different email) provision as distinct accounts instead of collapsing
        on NUID. Idempotent on email; replaces (not merges) the supplied groups.
        Requires the system Bearer token; non-system callers receive 403.
      parameters:
      - name: email
        in: path
        description: The account key (email).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: user upserted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
        '403':
          description: caller is not the system user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                groups:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                affiliation:
                  type: string
                  description: unscoped-affiliation, a human account label
      operationId: users_update_by_email
