  "/resources/{id}/reindex":
    parameters:
    - name: id
      in: path
      description: NOID of any resource
      required: true
      schema:
        type: string
    post:
      summary: Re-project a resource's Solr doc (system-only)
      tags:
      - Resources
      description: |
        Operational, **system-gated** Solr re-projection. Re-derives the
        resource's Solr doc from the current Postgres/OCFL source of truth — no
        lifecycle transition, no audit event, no optimistic-lock bump. This is
        the supported lever after an indexer ships or changes (e.g.
        `classification_ssim`) and an already-finalized resource carries a
        stale/empty projection; previously the only option was to abuse a
        lifecycle transition (`POST /works/{id}/complete`). Idempotent.

        Requires the system bearer token paired with the system `User:` NUID
        header; any non-system caller is rejected (401/403). Unknown id → 404.
      responses:
        '204':
          description: The resource's Solr document is re-projected from its current
            state.
        '404':
          description: No resource has that NOID.
        '403':
          description: The caller is neither the system user nor an admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: resources_reindex
  "/resources/{id}/reindex_subtree":
    parameters:
    - name: id
      in: path
      description: NOID of any resource (subtree root)
      required: true
      schema:
        type: string
    post:
      summary: Re-project a resource and its full descendant subtree (system-only)
      tags:
      - Resources
      description: |
        Operational, **system-gated** subtree Solr re-projection. Gathers the
        resource plus its full descendant subtree — descendant containers
        (Collection/Community) **and the Works beneath them**, a deliberate
        superset of the re-parent cascade so Work-level projections like
        `classification_ssim` refresh too — and re-derives each doc from the
        current Postgres/OCFL source of truth (no lifecycle/audit/lock bump).

        Rooted at a Collection it refreshes that Collection's contents; rooted
        at the top Community it backfills the whole repository. **Synchronous**
        by design — for a pathologically large subtree the caller roots lower or
        drives the cascade in chunks. Idempotent. Returns the count re-projected.
        Non-system callers are rejected (401/403); unknown id → 404.
      responses:
        '200':
          description: 'The number of resources re-projected: the root, its descendant
            containers and the Works beneath them.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  reindexed:
                    type: integer
                required:
                - reindexed
              example:
                reindexed: 2
        '404':
          description: No resource has that NOID.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: resources_reindex_subtree
  "/resources/{id}/search_explanation":
    get:
      summary: How the catalog search scores one object
      tags:
      - Resources
      description: |
        Solr's own account of how the catalog search scores one Work, Collection
        or Community for `q`, whether it matches or not, for debugging search.
        Admins and delegated admins only; a delegated admin must also be able to
        read the object.

        `explanation` is Solr's structured `explainOther` tree, unchanged.
        `handler` is the search handler's `qf`, `pf`, `mm`, `tie` and `boost`,
        read from Solr. `hidden_by` names the always-on catalog filters that
        hide the object whatever it matches.

        `fields` has one entry per `qf` field. Each stored value that feeds the
        field is analysed against `q`, and its index tokens carry `match`.
        Offsets count UTF-16 code units, as Solr reports them. A field with no
        stored text says why in `reason`: `not_stored`, or `full_text`, whose
        matching passages are in `highlights`. A failed analysis is
        `analysis_failed`; the other fields are still returned.

        400 for a blank `q`. 404 for an unknown NOID, a Set or any other type;
        404 with `error: not_indexed` when Solr holds no document for the
        object. 502 when Solr does not answer.
      parameters:
      - name: id
        in: path
        description: NOID
        required: true
        schema:
          type: string
      - name: q
        in: query
        required: true
        description: The search words
        schema:
          type: string
      responses:
        '200':
          description: Solr's explanation of how the object scores for `q`, whether
            it matches or not.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchExplanation"
              example:
                noid: d0000001x
                q: coastal surveys
                matched: true
                score: 1.982391119003296
                hidden_by: []
                parsed_query: FunctionScoreQuery(+((((title_tsim:coastal)^10.0 | (description_kstem_tesim:coastal)^2.5
                  | (description_tsim:coastal)^5.0 | title_plain_tsim:coastal | (title_stem_tesim:coastal)^5.0
                  | identifier_tesim:coastal | dwc_scientific_name_tesim:coastal |
                  (alternate_ids_tsim:coastal)^3.0 | (descriptive_keywords_tesim:coastal)^2.0
                  | subject_title_tesim:coastal | full_text_tesimv:coastal | (description_stem_tesim:coastal)^2.5
                  | title_split_tesim:coastal | contents_tesim:coastal | (title_variant_tesim:coastal)^4.0
                  | (title_kstem_tesim:coastal)^5.0 | name_variant_teim:coastal)~0.01
                  ((title_tsim:surveys)^10.0 | dwc_scientific_name_tesim:survey |
                  full_text_tesimv:survey | (description_stem_tesim:survey)^2.5 |
                  (title_variant_tesim:survey)^4.0 | (title_stem_tesim:survey)^5.0
                  | identifier_tesim:survey | title_split_tesim:surveys | (alternate_ids_tsim:surveys)^3.0
                  | (description_kstem_tesim:survey)^2.5 | (descriptive_keywords_tesim:survey)^2.0
                  | name_variant_teim:survey | (description_tsim:surveys)^5.0 | subject_title_tesim:survey
                  | contents_tesim:survey | (title_kstem_tesim:survey)^5.0 | title_plain_tsim:surveys)~0.01)~2)
                  ((full_text_tesimv:"coastal survey"~2)^10.0 | (title_tsim:"coastal
                  surveys"~2)^20.0)~0.01, scored by boost(if(exists(query(internal_resource_tesim:person,def=0.0)),const(0.9),const(1))))
                handler:
                  qf:
                    title_tsim: 10.0
                    title_stem_tesim: 5.0
                    title_kstem_tesim: 5.0
                    title_plain_tsim: 1.0
                    title_split_tesim: 1.0
                    title_variant_tesim: 4.0
                    description_tsim: 5.0
                    description_stem_tesim: 2.5
                    description_kstem_tesim: 2.5
                    alternate_ids_tsim: 3.0
                    identifier_tesim: 1.0
                    dwc_scientific_name_tesim: 1.0
                    subject_title_tesim: 1.0
                    contents_tesim: 1.0
                    descriptive_keywords_tesim: 2.0
                    name_variant_teim: 1.0
                    full_text_tesimv: 1.0
                  pf:
                    title_tsim: 20.0
                    full_text_tesimv: 10.0
                  mm: 2<-1 5<-2 6<90%
                  tie: 0.01
                  boost: if(exists(query({!v='internal_resource_tesim:Person'})),0.9,1)
                explanation:
                  match: true
                  value: 1.982391119003296
                  description: 'weight(FunctionScoreQuery(+(+((title_tsim:coastal)^10.0
                    | (description_kstem_tesim:coastal)^2.5 | (description_tsim:coastal)^5.0
                    | title_plain_tsim:coastal | (title_stem_tesim:coastal)^5.0 |
                    identifier_tesim:coastal | dwc_scientific_name_tesim:coastal |
                    (alternate_ids_tsim:coastal)^3.0 | (descriptive_keywords_tesim:coastal)^2.0
                    | subject_title_tesim:coastal | full_text_tesimv:coastal | (description_stem_tesim:coastal)^2.5
                    | title_split_tesim:coastal | contents_tesim:coastal | (title_variant_tesim:coastal)^4.0
                    | (title_kstem_tesim:coastal)^5.0 | name_variant_teim:coastal)~0.01
                    +((title_tsim:surveys)^10.0 | dwc_scientific_name_tesim:survey
                    | full_text_tesimv:survey | (description_stem_tesim:survey)^2.5
                    | (title_variant_tesim:survey)^4.0 | (title_stem_tesim:survey)^5.0
                    | identifier_tesim:survey | title_split_tesim:surveys | (alternate_ids_tsim:surveys)^3.0
                    | (description_kstem_tesim:survey)^2.5 | (descriptive_keywords_tesim:survey)^2.0
                    | name_variant_teim:survey | (description_tsim:surveys)^5.0 |
                    subject_title_tesim:survey | contents_tesim:survey | (title_kstem_tesim:survey)^5.0
                    | title_plain_tsim:surveys)~0.01) ((full_text_tesimv:"coastal
                    survey"~2)^10.0 | (title_tsim:"coastal surveys"~2)^20.0)~0.01,
                    scored by boost(if(exists(query(internal_resource_tesim:person,def=0.0)),const(0.9),const(1))))),
                    result of:'
                  details:
                  - match: true
                    value: 1.982391119003296
                    description: 'product of:'
                    details:
                    - match: true
                      value: 1.9823911
                      description: 'sum of:'
                      details:
                      - match: true
                        value: 1.9823911
                        description: 'sum of:'
                        details:
                        - match: true
                          value: 1.32203
                          description: 'max plus 0.01 times others of:'
                          details:
                          - match: true
