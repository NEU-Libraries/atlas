        '200':
          description: collection restored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
  "/communities":
    get:
      summary: List communities
      tags:
      - Communities
      responses:
        '200':
          description: communities listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunitiesIndex"
    post:
      summary: Create a community
      tags:
      - Communities
      description: |
        Creates a Community. `parent_id` is optional — top-level
        communities have no parent, and are the one create Atlas allows
        without a container. When `parent_id` IS given the caller must hold
        edit rights on that Community (Grouper edit grant, or ownership of
        it), otherwise `403`; a given-but-unresolvable one is `404`.

        Optional `depositor` is the NUID to stamp as the intellectual
        owner (mirrors the same surface on Collection/Work creates).
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: create with explicit depositor stamps the resource
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
        '403':
          description: caller holds no edit rights on the parent Community
        '404':
          description: parent_id given but unresolvable
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  nullable: true
                depositor:
                  type: string
                  description: NUID to stamp as the Community depositor (optional)
  "/communities/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Community
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a community
      tags:
      - Communities
      responses:
        '200':
          description: community found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
        '410':
          description: community tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
    patch:
      summary: Update a community
      tags:
      - Communities
      description: |
        Update a Community's descriptive metadata by supplying a `binary`
        MODS XML upload — the caller assembles the full document (descriptive
        merge logic lives in the client, not Atlas). `metadata[permissions]`
        adjusts the ACL. Any `metadata[title]` / `metadata[description]` keys
        are ignored.

        Thumbnail-family URI writes have their own purpose-specific
        endpoint — see `PATCH /communities/{id}/thumbnails`.
      parameters: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: MODS XML to apply to the Community
      responses:
        '200':
          description: community updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
    delete:
      summary: Destroy a community
      tags:
      - Communities
      description: |
        Permanently removes the Community, its descriptive-metadata FileSet,
        and the OCFL objects that hold the preserved bytes. This is a purge,
        not a withdrawal, and it cannot be reversed — use
        `POST /communities/{id}/tombstone` for that.

        Refuses with 422 (`has_children`) while the Community still holds a
        Collection or a sub-community, **including tombstoned ones**. That is
        stricter than tombstone, which only counts live members: a member
        left behind by a purge is orphaned for good. Empty the tree
        leaf-first.

        Admin only.
      responses:
        '204':
          description: community destroyed
        '422':
          description: community still has members
