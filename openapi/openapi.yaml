    WorkAssets:
      type: array
      items:
        oneOf:
        - type: object
          properties:
            noid:
              type: string
            mime_type:
              type: string
              nullable: true
            original_filename:
              type: string
              nullable: true
            size:
              type: integer
              nullable: true
            label:
              type: string
              nullable: true
          required:
          - noid
          description: Blob asset — held binary
        - type: object
          properties:
            noid:
              type: string
            mime_type:
              type: string
              nullable: true
            use:
              type: string
              nullable: true
            uri:
              type: string
              nullable: true
            label:
              type: string
              nullable: true
          required:
          - noid
          description: Delegate asset — external pointer (e.g. IIIF URL)
    Pagination:
      type: object
      description: pagy pagination block
      additionalProperties: true
    User:
      type: object
      description: Devise/AR User record serialized via to_json. Fields vary; commonly
        includes id, email, name, role.
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
      additionalProperties: true
    ProvisionedUser:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: integer
            nuid:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            role:
              type: string
            groups:
              type: array
              items:
                type: string
          required:
          - id
          - nuid
          - name
          - email
          - role
          - groups
      required:
      - user
    Permissions:
      type: object
      properties:
        resource:
          type: object
          properties: {}
          required: []
          additionalProperties: true
