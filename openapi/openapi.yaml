          - title
          - description
      required:
      - community
    FileSetSummary:
      type: object
      properties:
        file_set:
          type: object
          properties:
            id:
              type: string
              description: NOID
            type:
              type: string
              nullable: true
            tombstoned:
              type: boolean
              description: Withdrawn-from-discovery flag
            tombstoned_at:
              type: string
              nullable: true
              description: ISO-8601 timestamp set when tombstoned
            tombstoned_by:
              type: string
              nullable: true
