              type: string
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            in_progress:
              type: boolean
              description: Cerberus-driven workflow flag; true until the bulk-deposit
                job marks the Work complete.
          required:
          - id
          - title
          - description
          - in_progress
      required:
      - work
    CollectionSummary:
      type: object
      properties:
        collection:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
          required:
