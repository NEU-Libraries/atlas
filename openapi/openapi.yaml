            application/json:
              schema:
                "$ref": "#/components/schemas/FileSetsIndex"
    post:
      summary: Create a file set
      tags:
      - FileSets
      description: |
        Creates a FileSet under a Work, classified by name (e.g. `generic`).

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created FileSet. 410 + tombstone payload if the
        underlying FileSet has been tombstoned in the interim.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      responses:
        '200':
          description: idempotent replay returns existing file set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '410':
          description: idempotent replay on a tombstoned file set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id:
                  type: string
                  description: NOID of the parent Work
                classification:
                  type: string
                  description: Classification name, e.g. generic
                position:
                  type: integer
                  description: Optional 1-based page order within the parent Work
                    (multipage Works). Omit for unordered FileSets.
              required:
              - work_id
              - classification
  "/file_sets/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the FileSet
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a file set
      tags:
      - FileSets
      responses:
        '200':
          description: file set found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '410':
          description: file set tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
    patch:
      summary: Append binary content to a file set
      tags:
      - FileSets
      description: |
        Attaches a binary as a Blob appended to the existing FileSet — the
        ordered/classified-slot attach used after `POST /file_sets` cuts the slot.

        Idempotent on the optional `Idempotency-Key` header: a repeat request
        from the same caller with the same key returns the FileSet with its
        already-attached Blob without re-uploading the bytes (410 + tombstone
        payload if the FileSet was tombstoned in the interim). Retains the v1
        `original_filename`, and verifies an optional `expected_digest`
        (`"<algorithm>:<hexvalue>"`), 422 on mismatch. An id that resolves to no
        FileSet is a 404.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing FileSet without
          recopying bytes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: Binary file to attach
                original_filename:
                  type: string
                  description: Preserved v1 filename, stored on the resulting Blob
                expected_digest:
                  type: string
                  description: Optional verify-on-ingest checksum, "<algorithm>:<hexvalue>".
                    422 on mismatch.
              required:
              - binary
      responses:
        '200':
          description: idempotent replay does not recopy bytes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '422':
          description: verify-on-ingest rejects a digest mismatch
        '404':
          description: file set not found
    delete:
      summary: Destroy a file set
      tags:
      - FileSets
      description: |
        Permanently removes the FileSet, cascades into its Blobs, and removes
        the OCFL objects that hold the preserved bytes — every retained
        revision, not only the current one. Cannot be reversed. Rebuilds the
        parent Work's METS structMap without the removed pages.

        Admin only.
      responses:
        '204':
          description: file set destroyed
  "/file_sets/{id}/iiif_service":
    parameters:
    - name: id
      in: path
      description: NOID of the FileSet
      required: true
      schema:
        type: string
    patch:
      summary: Attach the IIIF image-service Delegate URI to a file set
      tags:
      - FileSets
      description: |
        Upserts the per-page IIIF image-service pointer (`service_file`
        Delegate role) on the FileSet — the Cantaloupe base URI for the
        page's JP2, from which a viewer derives any size on demand via
        `info.json`. The Delegate nests in a `:derivative` FileSet under
        the page and surfaces in `GET /works/{id}/file_sets` for IIIF
        manifest assembly.

        Sibling of the Work-level `/thumbnails` and `/image_derivatives`
        endpoints, dispatched through DelegateUpdater: re-PATCHing never
        mints a duplicate Delegate, and a blank or missing `uri` is a
        no-op.
      parameters: []
      responses:
        '200':
          description: re-PATCHing upserts in place — one Delegate, latest URI
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '404':
          description: unknown file set
        '409':
          description: optimistic-lock conflict survived the internal retry budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - uri
              properties:
                uri:
                  type: string
                  description: IIIF image-service base URI for the page's JP2
  "/file_sets/{id}/mets":
    parameters:
    - name: id
      in: path
      description: NOID of the FileSet
      required: true
      schema:
        type: string
    get:
      summary: Retrieve METS metadata for a file set
      tags:
      - FileSets
      description: Returns the JSON projection of the FileSet structural (METS) metadata.
      responses:
        '200':
          description: mets returned
  "/reset":
    get:
      summary: Reset development/test state
      tags:
      - Maintenance
      operationId: maintenance_reset
      description: |
        Wipes the database and Solr index. Refuses to run in production.

        **Internal endpoint — do not call from clients.** Used by test
        harnesses and developer-environment seeders.
      responses:
        '204':
          description: state reset
  "/people":
    get:
      summary: List or batch-resolve people
      tags:
      - People
      description: |
        Without params: a paginated list of all Persons (`?page`, `?per_page`) —
        the NOID-keyed People-index source; each row carries the NOID (public
        address) plus the server-side nuid. With `?nuids=a,b,c`: batch-resolve to
        the authoritative display_name (supersedes the SSO users directory's
        name), dropping unresolved nuids — page size follows the match count.
      parameters:
      - name: nuids
        in: query
        required: false
        description: Comma-separated NUIDs to batch-resolve
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Page size (capped at 100)
        schema:
          type: integer
      responses:
        '200':
          description: batch resolve by nuids (no pagination)
