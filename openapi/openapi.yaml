    Compilation:
      type: object
      properties:
        compilation:
          type: object
          properties:
            id:
              type: string
              description: NOID (minted; the API-addressable id)
            title:
              type: string
            description:
              type: string
              nullable: true
            depositor:
              type: string
              description: Curator NUID (owner)
            included_collections:
              type: array
              items:
                type: string
              description: Collection noids included transitively (self + descendants)
            included_works:
              type: array
              items:
                type: string
              description: Work noids included individually
            excluded_works:
              type: array
              items:
                type: string
              description: Work noids set aside (subtracted from the resolved union)
            edit_users:
              type: array
              items:
                type: string
            read_groups:
              type: array
              items:
                type: string
            edit_groups:
              type: array
