              digest:
                type: string
                nullable: true
                description: Fixity as recorded at that version, "<algorithm>:<hexvalue>"
              size:
                type: integer
                nullable: true
                description: Byte size of this revision
              original_filename:
                type: string
                nullable: true
                description: Stable original filename (preserved across revisions)
            required:
            - version_id
            - file_identifier
            - created
            - actor_nuid
            - on_behalf_of_nuid
            - digest
            - size
            - original_filename
      required:
      - blob_id
      - versions
