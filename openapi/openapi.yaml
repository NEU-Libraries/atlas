  "/resources/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of any resource (Work, Collection, Community, FileSet)
      required: true
      schema:
        type: string
    get:
      summary: Resolve a resource by NOID
      tags:
      - Resources
      description: Generic resolver. Issues a 302 redirect to the typed endpoint (e.g.
        `/works/{id}`).
      responses:
        '302':
          description: redirect to typed resource
  "/resources/{id}/permissions":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Permission flags for a resource
      tags:
      - Resources
      responses:
        '200':
          description: permissions returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Permissions"
  "/resources/{id}/mods":
    parameters:
    - name: id
      in: path
      description: NOID of any Modsable resource (Work, Collection, Community)
      required: true
      schema:
        type: string
    get:
      summary: Retrieve current MODS metadata for any resource
      tags:
      - Resources
      description: |
        Type-agnostic current MODS: resolves the NOID and returns the resource's
        descriptive MODS without the caller knowing whether it is a Work,
        Collection, or Community. Output is byte-identical to the typed
        /works|collections|communities/{id}/mods routes (same views). Returns
        the JSON projection by default; append the .xml format suffix
        (/resources/{id}/mods.xml) for MODS XML. 404 for an unknown id, a
        non-Modsable resource, or one with no MODS.
      responses:
        '200':
          description: current mods returned
        '404':
          description: unknown id / non-Modsable / no MODS
  "/resources/{id}/mods/versions":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List MODS version history for a resource
      tags:
      - Resources
      description: |
        Reverse-chronological list of retained MODS versions for any Modsable
        resource (Work / Collection / Community). Each descriptor carries the
        OCFL version label and creation time, plus actor attribution correlated
        from the audit log (`actor_nuid` etc. are null when no edit event
        matches — e.g. the seed version a resource is born with).

        Admin-gated, like `/history`, because the descriptors expose the same
        edit attribution. A resource with no MODS yields `{ "versions": [] }`.
      responses:
        '200':
          description: versions listed (newest first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModsVersions"
  "/resources/{id}/mods/versions/{version_id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: version_id
      in: path
      description: OCFL version label, e.g. v1
      required: true
      schema:
        type: string
    get:
      summary: Fetch MODS XML as of a specific version
      tags:
      - Resources
      description: |
        Returns the raw historical descMetadata.xml as of the given OCFL
        version. XML only — the JSON access copy is overwritten in place and
        is not version-recoverable. Unknown version or absent MODS → 404.
      responses:
        '200':
          description: historical MODS XML returned
        '404':
          description: unknown version
  "/resources/preview":
    post:
      summary: Render a temporary resource preview
      tags:
      - Resources
      description: Given raw MODS XML, renders an HTML preview without persisting.
        Used by the loader/editor surface.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: MODS XML to preview
              required:
              - binary
      responses:
        '200':
          description: preview rendered
  "/resources/find_many":
    post:
      summary: Resolve many resources by id in one round-trip
      tags:
      - Resources
      description: |
        Batch resolver. Takes a list of NOIDs and returns a lightweight digest
        per resolvable resource in a single index-backed query, collapsing a
        per-id find fan-out into one request.

        The result is **unordered** and **may be shorter than the input**:
        unresolvable ids are dropped silently. Tombstoned resources are kept
        but flagged (`tombstoned: true`) so callers can render a placeholder.
        Callers should index the result by `noid`.
      parameters: []
      responses:
        '200':
          description: empty id list returns an empty array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResourceDigests"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: NOIDs to resolve
              required:
              - ids
  "/resources/{id}/reindex":
    parameters:
    - name: id
      in: path
      description: NOID of any resource
      required: true
      schema:
        type: string
    post:
      summary: Re-project a resource's Solr doc (system-only)
      tags:
      - Resources
      description: |
        Operational, **system-gated** Solr re-projection. Re-derives the
        resource's Solr doc from the current Postgres/OCFL source of truth — no
        lifecycle transition, no audit event, no optimistic-lock bump. This is
        the supported lever after an indexer ships or changes (e.g.
        `classification_ssim`) and an already-finalized resource carries a
        stale/empty projection; previously the only option was to abuse a
        lifecycle transition (`POST /works/{id}/complete`). Idempotent.

        Requires the system bearer token paired with the system `User:` NUID
        header; any non-system caller is rejected (401/403). Unknown id → 404.
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: System principal, e.g. "NUID 000000000"
        schema:
          type: string
      responses:
        '204':
          description: resource re-projected from current state
        '404':
          description: unknown id
        '403':
          description: non-system caller is rejected
  "/resources/{id}/reindex_subtree":
    parameters:
    - name: id
      in: path
      description: NOID of any resource (subtree root)
      required: true
      schema:
        type: string
    post:
      summary: Re-project a resource and its full descendant subtree (system-only)
      tags:
      - Resources
      description: |
        Operational, **system-gated** subtree Solr re-projection. Gathers the
        resource plus its full descendant subtree — descendant containers
        (Collection/Community) **and the Works beneath them**, a deliberate
        superset of the re-parent cascade so Work-level projections like
        `classification_ssim` refresh too — and re-derives each doc from the
        current Postgres/OCFL source of truth (no lifecycle/audit/lock bump).

        Rooted at a Collection it refreshes that Collection's contents; rooted
        at the top Community it backfills the whole repository. **Synchronous**
        by design — for a pathologically large subtree the caller roots lower or
        drives the cascade in chunks. Idempotent. Returns the count re-projected.
        Non-system callers are rejected (401/403); unknown id → 404.
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: System principal, e.g. "NUID 000000000"
        schema:
          type: string
      responses:
        '200':
          description: subtree re-projected; descendant Works refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reindexed:
                    type: integer
                required:
                - reindexed
        '404':
          description: unknown id
  "/resources/{id}/descendant_works":
    parameters:
    - name: id
      in: path
      description: NOID of any resource (subtree root)
      required: true
      schema:
        type: string
    get:
      summary: Every Work beneath a resource, flattened (gated, paginated)
      tags:
      - Resources
      description: |
        Resolves a resource's full descendant subtree to the Works it contains,
        at any depth — the structural counterpart to
        `GET /compilations/{id}/contents`. Same digest shape and query engine,
        but the container set is the resource's own subtree (self +
        `ancestor_ids_ssim` descendants) instead of a Set recipe.

        Gated per-Work to what the caller may discover (public + the caller's
        groups; admins see everything; same semantics as Cerberus gated
        discovery), so a restricted Work never leaks via the subtree. Tombstoned
        works are dropped. Membership is **structural** (`a_member_of`) only;
        pass `include_linked=true` to also surface linked members
        (`a_linked_member_of`). Solr-side pagination via `page` / `per_page`
        (default 25, capped at 100). Unknown id → 404.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: include_linked
        in: query
        required: false
        description: Include linked members (a_linked_member_of); structural-only
          by default
        schema:
          type: boolean
      responses:
        '200':
          description: descendant works (transitively flattened, gated, paginated)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DescendantWorks"
        '404':
          description: unknown id
  "/users/by_nuid/{nuid}/accounts":
    get:
      summary: List the accounts sharing a NUID
      tags:
      - User
      description: |
        Every account sharing this NUID (a person's staff/student logins), each
        with email, affiliation label, role, stored group set, and the
        preferred flag. Discloses group sets, so it is limited to the person
        themselves, an admin, or the system principal; others receive 403.
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: accounts listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserAccounts"
  "/users/by_nuid/{nuid}/preferred_account":
    put:
      summary: Set the preferred (default) account for a NUID
      tags:
      - User
      description: |
        Set the person's default account (drives the login choice when no
        account is named). Same self/admin/system scope as the accounts list.
        An email that is not one of this NUID's accounts → 404.
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: preferred account set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
        '404':
          description: email is not one of this NUID's accounts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  "/users":
    get:
      summary: Search the user directory
      tags:
      - User
      description: |
        Read-only user directory. Two modes, same response shape:

        - `?q=<fragment>` — typeahead search: case-insensitive match on
          name, prefix match on NUID. Capped at 10, ordered by name.
        - `?nuids=a,b,c` — batch resolve (up to 100): exact NUIDs to
          entries; unknown NUIDs are dropped.

        Rows with role `anonymous`, `guest`, or `system` are never
        returned. With neither parameter the list is empty. Entries carry
        `nuid` + `name` only — a directory, not a profile endpoint.
      parameters:
      - name: q
        in: query
        required: false
        description: Name fragment (case-insensitive) or NUID prefix
        schema:
          type: string
      - name: nuids
        in: query
        required: false
        description: Comma-separated NUIDs to resolve in one call
        schema:
          type: string
      responses:
        '200':
          description: resolved directory entries (batch)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserDirectory"
  "/users/by_nuid/{nuid}":
    get:
      summary: Resolve a NUID to a directory entry
      tags:
      - User
      description: |
        Single NUID to `{ nuid, name }`. Unknown NUIDs and rows with role
        `anonymous`, `guest`, or `system` both read as absent (404).
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: directory entry found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserDirectoryEntry"
        '404':
          description: unknown or excluded NUID
    put:
      summary: Find-or-create a user and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Idempotent
        on NUID; replaces (not merges) the supplied groups onto the user.
        Requires the system Bearer token (no `User:` header); non-system
        callers receive 403.
      security:
      - BearerAuth: []
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: Acting principal, e.g. "NUID 000000000" for the system user
        schema:
          type: string
      responses:
        '200':
          description: user upserted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
        '403':
          description: caller is not the system user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    type: string
                email:
                  type: string
                name:
                  type: string
  "/user":
    get:
      summary: Current user details
      tags:
      - User
      description: |
        Returns the user resolved from the request auth context. With no
        valid Bearer/NUID, falls through to the guest user record. An optional
        `email` selects a specific one of the caller's other accounts under the
        same NUID (the switch flow); a foreign account is 403.
      parameters:
      - name: email
        in: query
        required: false
        description: Read a specific account under the caller's NUID (must be one
          of theirs).
        schema:
          type: string
      responses:
        '200':
          description: user returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
  "/nuid":
    post:
      summary: Mint a JWT for a NUID (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus (post-SSO) to mint a personal-
        access JWT for a user. The librarian then uses the token directly
        against Atlas (Authorization: Bearer …) from scripts. Tokens carry a
        1-week TTL. Requires the system Bearer token; non-system callers
        receive 403. An unknown NUID returns 404. Emits a mint_token audit row.
        An optional `read_only: true` mints a token that can only reach
        read-shaped actions (:read, :preview, :read_versions) regardless of
        the underlying user's own permissions — the shape to hand to a
        non-human caller (e.g. an MCP client) that must never be able to
        mutate the repository.
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: Acting principal, e.g. "NUID 000000000" for the system user
        schema:
          type: string
      responses:
        '200':
          description: read-only token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                - token
        '403':
          description: caller is not the system user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                email:
                  type: string
                  description: Optional — disambiguate which account under the NUID
                    when it holds several.
                read_only:
                  type: boolean
                  description: Optional — mint a token restricted to read-shaped actions
                    only.
              required:
              - nuid
    delete:
      summary: Revoke all of a user's tokens (system-only)
      tags:
      - User
      description: |
        System-only endpoint that revokes every outstanding token for a user
        by rotating its jti (single-token model → all-or-nothing). Cerberus's
        "regenerate token" is a revoke followed by a fresh mint. Requires the
        system Bearer token; non-system callers receive 403. An unknown NUID
        returns 404. Emits a revoke_token audit row.
      security:
      - BearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: Acting principal, e.g. "NUID 000000000" for the system user
        schema:
          type: string
      responses:
        '204':
          description: tokens revoked
        '403':
          description: caller is not the system user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                email:
                  type: string
                  description: Optional — disambiguate which account under the NUID
                    when it holds several.
              required:
              - nuid
  "/users/by_email/{email}":
    put:
      summary: Find-or-create a user by email and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Email is the
        account key, so a person's staff and student logins (same NUID,
        different email) provision as distinct accounts instead of collapsing
        on NUID. Idempotent on email; replaces (not merges) the supplied groups.
        Requires the system Bearer token; non-system callers receive 403.
      security:
      - BearerAuth: []
      parameters:
      - name: email
        in: path
        description: The account key (email).
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: Acting principal, e.g. "NUID 000000000" for the system user
        schema:
          type: string
      responses:
        '200':
          description: user upserted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
        '403':
          description: caller is not the system user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
                groups:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                affiliation:
                  type: string
                  description: unscoped-affiliation, a human account label
  "/works":
    get:
      summary: List works
      tags:
      - Works
      description: |
        Paginated list of all works.

        Pass `?in_progress=true` to see only Works that Cerberus has not
        yet marked complete (operator-friendly "what's stuck?" view).
        Pass `?in_progress=false` to see only completed Works.

        Pass `?incomplete=true` for the other operator list: Works whose
        enrichment pipeline gave up after its retries (see
        `POST /works/{id}/incomplete`). The two filters are independent and
        combine, so `?in_progress=false&incomplete=true` reads as "finished,
        but degraded".
      parameters:
      - name: in_progress
        in: query
        required: false
        description: Filter by in_progress state. Omit for no filtering.
        schema:
          type: boolean
      - name: incomplete
        in: query
        required: false
        description: Filter by incomplete state. Omit for no filtering.
        schema:
          type: boolean
      responses:
        '200':
          description: the two filters combine — finished but degraded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorksIndex"
    post:
      summary: Create a work
      tags:
      - Works
      description: |
        Creates a new Work as a child of the given Collection.

        The caller must hold edit rights on that Collection — a Grouper edit
        grant, or ownership of it (its `depositor`, which is what makes a
        deposit into one's own workspace work). Otherwise `403`.
        `collection_id` is required: a blank or unresolvable one is `404`.

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created Work instead of creating a new one. If the
        underlying Work has since been tombstoned, the replay returns
        410 with the tombstone payload (same body shape as GET).
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: idempotent replay returns existing work
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '410':
          description: idempotent replay on a tombstoned work
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '403':
          description: caller holds no edit rights on the parent Collection
        '404':
          description: collection_id missing or unresolvable
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_id:
                  type: string
                  description: NOID of the parent Collection
                depositor:
                  type: string
                  description: NUID to stamp as the Work depositor (optional)
              required:
              - collection_id
  "/works/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a work
      tags:
      - Works
      responses:
        '200':
          description: ancestors carry each ancestor noid, klass and title (root-first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '410':
          description: work tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
    patch:
      summary: Update a work
      tags:
      - Works
      description: |
        Update a Work's descriptive metadata by supplying a `binary` MODS XML
        upload — the caller assembles the full document (descriptive merge logic
        lives in the client, e.g. Cerberus, not Atlas). `metadata[permissions]`
        adjusts the ACL. Any `metadata[title]` / `metadata[description]` keys are
        ignored.

        Two rules bound an ACL write. A resource may be no more visible than its
        container, so a read audience wider than the parent's is refused with
        `422 visibility_exceeds_parent` (widen the parent instead). And a group
        grant may only be removed by a member of that group — admin and the
        devolved-admin tier excepted; a grant the caller cannot remove is
        preserved rather than rejected, so the stored ACL may retain groups the
        request omitted. Read it back with `GET /resources/{id}/permissions`.

        Programmatic Delegate writes (thumbnail-family URIs, sized image
        derivatives) no longer ride this endpoint — see the dedicated
        `PATCH /works/{id}/thumbnails` and `PATCH /works/{id}/image_derivatives`
        routes.
      parameters: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: MODS XML to apply to the Work
      responses:
        '200':
          description: work updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict on the update (surfaced immediately,
            not retried)
    delete:
      summary: Destroy a work
      tags:
      - Works
      description: |
        Permanently removes the Work. This is a purge, not a withdrawal: it
        deletes the Work's metadata, cascades into its FileSets and their
        Blobs, and removes the OCFL objects that hold the preserved bytes —
        every retained revision, not only the current one. Nothing survives
        but the audit row, which records the NOIDs it removed.

        Use `POST /works/{id}/tombstone` for the user-visible withdrawal
        path. That one keeps everything and can be reversed.

        Admin only.
      responses:
        '204':
          description: work destroyed
  "/works/{id}/mods":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve MODS metadata for a work
      tags:
      - Works
      description: 'Returns MODS XML by default; pass Accept: application/json for
        the JSON projection.'
      responses:
        '200':
          description: mods returned
  "/works/{id}/mets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve METS structural metadata for a work
      tags:
      - Works
      description: |
        JSON projection of the Work-level structural (METS) metadata. The
        physical structMap records page order (surfaced under mets.pages);
        it is built when the Work is completed (POST /works/:id/complete)
        and rebuilt eagerly on page changes thereafter. 404 for Works that
        have never been completed.
      responses:
        '200':
          description: work mets returned
        '404':
          description: work never completed — no METS yet
  "/works/{id}/assets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List downloadable assets attached to a work
      tags:
      - Works
      description: |
        Returns a polymorphic array of downloadable assets attached to the
        Work: held binaries (Blob entries with size + original_filename)
        and external pointer-only derivatives (Delegate entries with
        use + uri, e.g. IIIF-served sized image variants). Thumbnails
        (Role.thumbnail_image) and metadata roles are excluded by
        Role.downloadable?.
      responses:
        '200':
          description: the gate also surfaces on held Blob entries (master / pdf)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssets"
  "/works/{id}/file_sets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List a work's page FileSets in order
      tags:
      - Works
      description: |
        Ordered page listing for multipage Works: one entry per page-bearing
        FileSet (descriptive/structural-metadata and derivative FileSets are
        excluded), sorted position ASC with unordered (null) FileSets last,
        creation-order tie-break. Each entry nests its downloadable assets —
        the page's content Blobs plus any per-page IIIF Delegates living in
        a derivative FileSet under the page. Unpaginated by design: manifest
        assembly needs the whole sequence in one read.
      responses:
        '200':
          description: assets stay grouped under their page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkFileSets"
        '404':
          description: work not found
  "/works/{id}/thumbnails":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Attach thumbnail-family IIIF Delegate URIs to a work
      tags:
      - Works
      description: |
        Upserts one or more thumbnail-tier Delegates on the Work — the
        85px `thumbnail`, the 170px `thumbnail_2x`, and the 500px hero
        `preview`. Each non-blank URI is dispatched to DelegateUpdater
        against its matching Role; missing keys are left untouched.

        Purpose-specific: machine-set IIIF URLs, fixed three-key shape,
        no user content. Cerberus's ThumbnailCreationJob is the primary
        caller.
      parameters: []
      responses:
        '200':
          description: all three thumbnail-family keys land in one PATCH
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  description: IIIF URL for the 85px thumbnail tier
                thumbnail_2x:
                  type: string
                  description: IIIF URL for the 170px retina thumbnail tier
                preview:
                  type: string
                  description: IIIF URL for the 500px hero preview tier
  "/works/{id}/image_derivatives":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Attach sized-image IIIF Delegate URIs to a work
      tags:
      - Works
      description: |
        Upserts one or more downloadable image-derivative Delegates on
        the Work — `small`, `medium`, and `large` IIIF URLs. Each
        non-blank URI is dispatched to DelegateUpdater against its
        matching Role (small_image / medium_image / large_image);
        missing keys are left untouched.

        Sibling of `/thumbnails`. These derivatives surface in
        `/works/{id}/assets` and are intended to be downloaded directly
        rather than rendered as UI chrome.
      parameters: []
      responses:
        '200':
          description: all three image-derivative keys land in one PATCH
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                small:
                  type: string
                  description: IIIF URL for the small image tier
                medium:
                  type: string
                  description: IIIF URL for the medium image tier
                large:
                  type: string
                  description: IIIF URL for the large image tier
  "/works/{id}/derivative_permissions":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Set a work's per-asset derivative-visibility policy
      tags:
      - Works
      description: |
        Replaces the Work's per-asset read policy for its downloadable renditions —
        which Grouper groups may fetch each binary. Two media families: the image
        ladder `small` / `medium` / `large` / `service` (deep-zoom) / `master` (the
        original image), and the independent media `audio` / `video` / `pdf`. Each
        tier is an array of read-group tokens (the resource vocabulary: `public`,
        Grouper group names, `[]` = private).

        Whole-object replace: the body is the complete policy; omitted tiers
        inherit by cascade WITHIN the image ladder (an absent tier inherits the
        next lower-resolution tier; `small` inherits the Work). Independent media
        do not cascade — an absent `audio`/`video`/`pdf` key rides the Work.
        Invariants are enforced (422 on violation): a tier may not be more visible
        than the Work (`tier_exceeds_resource`); within the image ladder visibility
        must narrow as resolution grows —
        `master` ⊆ `service` ⊆ `large` ⊆ `medium` ⊆ `small` (`tier_ordering_violation`;
        independent media impose no ordering); an unrecognized tier key is
        `unknown_tier`.

        The gate is advisory — Cerberus and the IIIF auth layer enforce it (image
        tiers via signed IIIF URLs, held binaries via Cerberus's download :read
        check). The effective per-asset gate surfaces on `GET /works/{id}/assets`
        (`gated` / `permission`) for both Delegate and Blob entries, and the stored
        map echoes back under `derivative_permissions`.
      parameters: []
      responses:
        '200':
          description: accepts the widened vocabulary (master + independent media)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '422':
          description: an unknown tier key is rejected
        '409':
          description: optimistic-lock conflict surfaces (permission edits are not
            retried)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                small:
                  type: array
                  items:
                    type: string
                  description: Read groups for the small image tier
                medium:
                  type: array
                  items:
                    type: string
                  description: Read groups for the medium image tier
                large:
                  type: array
                  items:
                    type: string
                  description: Read groups for the large image tier
                service:
                  type: array
                  items:
                    type: string
                  description: Read groups for the service (deep-zoom) image tier
                master:
                  type: array
                  items:
                    type: string
                  description: Read groups for the master (original image) — the image-ladder
                    floor
                audio:
                  type: array
                  items:
                    type: string
                  description: Read groups for audio renditions (independent)
                video:
                  type: array
                  items:
                    type: string
                  description: Read groups for video renditions (independent)
                pdf:
                  type: array
                  items:
                    type: string
                  description: Read groups for PDF renditions (independent)
  "/works/{id}/full_text":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Store a work’s derived full-document text
      tags:
      - Works
      description: |
        Stores the Work-level aggregate of Cerberus-extracted document text as
        the Work's derived `full_text` attribute. FullTextIndexer projects it
        onto the Work's Solr doc as the dedicated `full_text_tesimv` field for
        body-text search and the "Full Text Match" snippet.

        Same "machine-set derived metadata" seam as `/thumbnails` — a
        regenerable search aid re-sent on any re-ingest, never user-authored.
        Cerberus's FullTextExtractionJob is the primary caller. The response
        omits the text (a long PDF is MBs); it's read back only through Solr.
      parameters: []
      responses:
        '200':
          description: full text stored and projected to full_text_tesimv
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Extracted plain text (Work-level aggregate of content
                    FileSets)
              required:
              - text
  "/works/{id}/parent":
    parameters:
    - name: id
      in: path
      description: NOID of the Work to move
      required: true
      schema:
        type: string
    patch:
      summary: Re-parent a work
      tags:
      - Works
      description: |
        Moves a Work to a different Collection. Trivial sibling of the
        collection/community re-parent: a Work has no descendants and carries
        no ancestry field, so there is NO cascade — only its own a_member_of
        changes. Permissions are untouched. Rejects a non-Collection parent
        and tombstoned node/parent with a 422.
      parameters: []
      responses:
        '200':
          description: work moved to another collection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: unknown work
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - parent_id
              properties:
                parent_id:
                  type: string
                  description: NOID of the destination Collection
  "/works/{id}/linked_members":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List the collections a work is linked into
      tags:
      - Works
      description: |
        Returns the NOIDs of the Collections this Work is a *linked* member of
        (the DAG overlay — additional placements beyond its one structural
        home). Powers Cerberus's provenance panel. Does not include the
        structural parent (that's `a_member_of`, surfaced via ancestors).
      responses:
        '200':
          description: linked collections listed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    post:
      summary: Link a work into an additional collection
      tags:
      - Works
      description: |
        Adds the Work as a linked member of the target Collection — placement
        only, never a permission change. Admin-only for edit-rights holders:
        linking a Work into additional Collections is a structural mutation of
        the content graph, so edit rights are not sufficient. The :system
        principal has one narrow exception (Cerberus's "Publish to my
        community" deposit flow): given an `On-Behalf-Of` header naming the
        Work's own depositor, it may link that Work into a *featured* showcase
        Collection only. Rejects a non-Collection target, a tombstoned
        work/target, and a target that is already the Work's structural home,
        with a 422. Returns the updated list of linked collection NOIDs.
      parameters: []
      responses:
        '200':
          description: work linked into the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '422':
          description: rejects a non-Collection target
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - collection_id
              properties:
                collection_id:
                  type: string
                  description: NOID of the Collection to link into
  "/works/{id}/linked_members/{collection_id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    - name: collection_id
      in: path
      description: NOID of the linked Collection to remove
      required: true
      schema:
        type: string
    delete:
      summary: Unlink a work from a collection
      tags:
      - Works
      description: |
        Removes a linked membership (idempotent — removing an absent link is a
        no-op). Same authorization as the add (admin, or :system scoped to its
        own on_behalf_of depositor plus a featured Collection). Returns the
        updated list of linked collection NOIDs. Permissions are never changed.
      responses:
        '200':
          description: work unlinked from the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  "/works/{id}/associations":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List a work's associations
      tags:
      - Works
      description: |
        Returns the typed relationships between this Work and other Works
        (DRS v1's "associated works"), read from both ends and keyed by
        predicate.

        `outbound` is what this Work asserts — "I am the codebook for that
        dataset". `inbound` is what other Works assert about it — "those
        Works say they are figures for me". The edge is stored once, on the
        asserting Work; the inbound direction is derived, never stored, so
        the two can never disagree. Predicates with no edges are omitted.

        The five predicates are `is_codebook_for`, `is_figure_for`,
        `is_instructional_material_for`, `is_supplemental_material_for` and
        `is_transcription_of`.

        Not part of the Work show payload — fetch it here when you need it.
      responses:
        '200':
          description: associations listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssociations"
    post:
      summary: Associate a work with another work
      tags:
      - Works
      description: |
        Asserts a typed, directed relationship from this Work to another —
        "this is the codebook for that dataset". Both Works stay separate
        records; nothing moves in the containment tree and no ACL changes.

        The edge is stored only on this Work. `GET` on the target reports the
        same edge under `inbound`, so there is no reciprocal edge to keep in
        step.

        Asserting an edge that already exists is a no-op. Two Works can hold
        several different edges at once.

        A cycle is permitted and meaningful: "A is a transcription of B" and
        "B is a figure for A" can both be true.

        Admin and devolved-admin only. The assertion renders on the target's
        page too, and the asserter may hold no rights over it, so this is an
        operator action rather than an edit-rights one.
      parameters: []
      responses:
        '200':
          description: work associated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssociations"
        '422':
          description: rejects an unknown relationship type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - work_id
              - type
              properties:
                work_id:
                  type: string
                  description: NOID of the Work this one is subordinate to
                type:
                  type: string
                  description: One of the five relationship predicates
                  enum:
                  - is_codebook_for
                  - is_figure_for
                  - is_instructional_material_for
                  - is_supplemental_material_for
                  - is_transcription_of
  "/works/{id}/associations/{type}/{work_id}":
    parameters:
    - name: id
      in: path
      description: NOID of the asserting Work
      required: true
      schema:
        type: string
    - name: type
      in: path
      description: The relationship predicate to retract
      required: true
      schema:
        type: string
    - name: work_id
      in: path
      description: NOID of the associated Work
      required: true
      schema:
        type: string
    delete:
      summary: Remove an association between two works
      tags:
      - Works
      description: |
        Retracts one typed relationship. Idempotent — retracting an edge that
        was never asserted is a no-op.

        The type is in the path rather than a query parameter because it is
        part of the edge's identity: retracting the figure claim leaves a
        transcription claim between the same two Works standing.

        Same authorization as the POST (admin and devolved admin). Returns
        the updated associations from both ends.
      responses:
        '200':
          description: association removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssociations"
  "/works/{id}/tombstone":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Tombstone a work
      tags:
      - Works
      description: Marks a Work as tombstoned. Always succeeds; FileSets and Blobs
        ride along with the parent Work.
      responses:
        '200':
          description: work tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
  "/works/{id}/restore":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Restore a tombstoned work
      tags:
      - Works
      description: Clears the tombstone flag on a Work. Cerberus does not expose this
        — call from operator console.
      responses:
        '200':
          description: work restored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
  "/works/{id}/complete":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Mark a work complete
      tags:
      - Works
      description: |
        Flips `in_progress` to false. Cerberus calls this after its
        per-record Solid Queue job confirms all expected children
        (FileSets / Blobs) are deposited. Idempotent — calling on an
        already-complete Work simply re-saves with in_progress: false.
      responses:
        '200':
          description: completing builds the Work-level METS structMap
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
  "/works/{id}/incomplete":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    post:
      summary: Flag a work whose pipeline gave up
      tags:
      - Works
      description: |
        Sets `incomplete` to true and records `incomplete_reason`. Cerberus
        calls this from a work-scoped job's give-up handler — the PDF or media
        rendition, the derivatives, the full-text extraction — once that job
        has exhausted its retries.

        This state **flags; it never hides**. A Work with its file, title and
        metadata but one missing derivative is degraded, not broken, and stays
        readable. `MODSIndexer` projects both fields onto the Work's Solr
        document (`incomplete_bsi`, `incomplete_reason_ssi`) so a result row
        can render a pill without a per-row fetch.

        `reason` is a machine token (`pdf_rendition_gave_up`,
        `media_rendition_gave_up`, `ingest_gave_up`, …). Atlas stores it as an
        opaque string and does **not** validate it against a list: the
        vocabulary belongs to the caller, so a new token must not need an
        Atlas release. A blank or absent reason still sets the flag — the
        caller is a job already on its failure path.

        Idempotent; the last reason wins. `DELETE` on the same path clears
        both fields when a later run of the job succeeds.
      parameters: []
      responses:
        '200':
          description: a body-less call still sets the flag, with a null reason
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: no such work
        '409':
          description: optimistic-lock conflict survived the internal retry budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Machine token naming the cause (e.g. pdf_rendition_gave_up)
    delete:
      summary: Clear the incomplete flag
      tags:
      - Works
      description: |
        Clears `incomplete` and `incomplete_reason` together. Cerberus calls
        this when a later run of the same job succeeds, which makes the state
        self-healing; an operator repairing a Work by hand can call it too.

        Idempotent — clearing a Work that was never flagged is a no-op.
      responses:
        '200':
          description: clearing a work that was never flagged is a no-op
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: no such work
