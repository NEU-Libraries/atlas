      parameters: []
      responses:
        '200':
          description: create with explicit depositor stamps the resource
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  nullable: true
                depositor:
                  type: string
                  description: NUID to stamp as the Community depositor (optional)
  "/communities/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Community
      required: true
