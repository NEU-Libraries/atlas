---
openapi: 3.0.3
info:
  title: Atlas API
  version: '1'
  description: |
    Atlas is the Northeastern University Library digital repository API.

    Two consumption surfaces of this document:

    - Humans: Scalar UI at `/docs`
    - Machines (clients, agents, codegen): the canonical OpenAPI
      document is served at `/api-docs/openapi.yaml`.

    ### Authentication

    Most write endpoints require a Cerberus system bearer token plus a
    `User` header carrying the acting NUID. Read endpoints generally
    allow unauthenticated guest access. Endpoints that require auth
    declare it explicitly below.
servers:
- url: "{scheme}://{host}"
  variables:
    scheme:
      default: https
      enum:
      - https
      - http
    host:
      default: atlas.library.northeastern.edu
tags:
- name: Communities
- name: Collections
- name: Works
- name: FileSets
- name: Files
- name: Resources
- name: Compilations
- name: User
- name: Maintenance
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Cerberus system token or a devise-jwt user token. Both are accepted.
    NuidHeader:
      type: apiKey
      in: header
      name: User
      description: NUID identity asserted by Cerberus, in the form `NUID <nuid>`.
        Required when calling with the system token to act as a user.
    OnBehalfOfHeader:
      type: apiKey
      in: header
      name: On-Behalf-Of
      description: 'Acting-as attribution target, in the form `NUID <nuid>`. Sent
        on writes during an acting-as session: the `User` header (the operator) authorizes
        the request and must be an admin; this header names the user the write is
        attributed to. On a create, the resulting resource reads as a pure deposit
        by the target — `depositor` = target, `proxy_uploader` left null — with the
        operator recorded only in the AuditEvent. A non-admin operator presenting
        this header is rejected (403).'
  schemas:
    Work:
      type: object
      properties:
        work:
          type: object
          properties:
            id:
              type: string
              description: NOID
            valkyrie_id:
              type: string
              description: Valkyrie internal id
            ancestors:
              type: array
              items:
                type: array
                items:
                  type: string
                minItems: 2
                maxItems: 2
                description: "[noid, type-name] pair"
            ancestor_chain:
              type: array
              description: Ancestor chain, root-first, with titles — array of {noid,
                klass, title} objects
              items:
                type: object
                properties:
                  noid:
                    type: string
                    description: Ancestor NOID
                  klass:
                    type: string
                    description: Ancestor resource class name
                  title:
                    type: string
                    description: Ancestor plain-text title (may be empty)
                required:
                - noid
                - klass
                - title
            thumbnail:
              type: string
              nullable: true
              description: IIIF URL of the :thumbnail_image Delegate (~85px), or null
            thumbnail_2x:
              type: string
              nullable: true
              description: IIIF URL of the :thumbnail_image_2x Delegate (~170px retina),
                or null
            preview:
              type: string
              nullable: true
              description: IIIF URL of the :preview_image Delegate (~500px hero),
                or null
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            permanent_url:
              type: string
              nullable: true
            tombstoned:
              type: boolean
              description: Withdrawn-from-discovery flag
            tombstoned_at:
              type: string
              nullable: true
              description: ISO-8601 timestamp set when tombstoned
            tombstoned_by:
              type: string
              nullable: true
              description: NUID of the user who tombstoned the resource
            depositor:
              type: string
              nullable: true
              description: NUID of the intellectual owner (the named depositor; may
                differ from the hands-on-keyboard actor)
            proxy_uploader:
              type: string
              nullable: true
              description: NUID of the hands-on-keyboard actor for the most-recent
                create. Equals depositor for self-deposit; differs in the librarian-on-behalf
                (proxy-deposit) case. Left null under acting-as impersonation (On-Behalf-Of
                header present) — the operator is recorded only in the AuditEvent,
                not on the resource.
            in_progress:
              type: boolean
              description: Cerberus-driven workflow flag; true until the bulk-deposit
                job marks the Work complete.
          required:
          - id
          - valkyrie_id
          - ancestors
          - ancestor_chain
          - thumbnail
          - thumbnail_2x
          - preview
          - title
          - description
          - permanent_url
          - tombstoned
          - tombstoned_at
          - tombstoned_by
          - depositor
          - proxy_uploader
          - in_progress
      required:
      - work
    Collection:
