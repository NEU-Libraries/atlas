      summary: Update a work
      tags:
      - Works
      description: |
        Update descriptive metadata on a Work. Either supply a `binary`
        MODS XML upload or `metadata[*]` form fields to merge in.

        Programmatic Delegate writes (thumbnail-family URIs, sized image
