  "/compilations":
    get:
      summary: List compilations (owner- or grant-scoped)
      tags:
      - Compilations
      description: |
        Paginated, newest-first listing of Compilations. Three modes:

        - default (no `scope`): the caller's own Sets. `?owner=<nuid>` lists
          another user's Sets — admin-only. There is no public browse endpoint.
        - `?scope=editable`: Sets the caller may edit but does **not** own
          (granted via `edit_users` or `edit_groups`).
        - `?scope=shared`: Sets shared with the caller but not owned
          (`read_groups` grants, plus the edit grants that imply read).

        Grant-scoped modes are keyed on the acting principal — `owner` is
        ignored — and group membership is resolved server-side. Pass
        `?q=<term>` to narrow by case-insensitive title substring in any mode;
        the filter applies before pagination, so the pagination block
        describes the filtered result.
      security:
      - BearerAuth: []
        NuidHeader: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        schema:
          type: string
      - name: owner
        in: query
        required: false
        description: NUID whose Sets to list (admin-only); defaults to the caller.
          Ignored when scope is given.
        schema:
          type: string
      - name: scope
        in: query
        required: false
        enum:
        - editable
        - shared
        description: "grant-scoped mode: editable (edit grants) or shared (read+edit
          grants), both excluding owned Sets:\n * `editable` \n * `shared` \n "
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: case-insensitive title substring filter
        schema:
          type: string
      responses:
        '200':
          description: editable-by-me listing (edit grants, owned excluded)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompilationsIndex"
        '400':
          description: unknown scope value
        '403':
          description: cross-owner listing as a non-admin
    post:
      summary: Create a compilation
      tags:
      - Compilations
      description: 'Creates a personal Set owned by the acting user (depositor is
        stamped from the authenticated NUID). Born private: empty ACLs, no staff default.'
      security:
      - BearerAuth: []
        NuidHeader: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        schema:
          type: string
      responses:
        '201':
          description: compilation created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '403':
          description: guest cannot create
        '422':
          description: missing title
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
              required:
              - title
  "/compilations/{id}":
    parameters:
    - name: id
      in: path
      description: Compilation NOID
      required: true
      schema:
        type: string
    get:
      summary: Fetch a compilation
      tags:
      - Compilations
      description: 'Per-row visibility: owner, explicit read/edit grants, or public.
        Public Sets are readable by unauthenticated (guest) callers — the CERES case.'
      security:
      - BearerAuth: []
        NuidHeader: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: guest reads a public set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '403':
          description: guest cannot read a private set
        '404':
          description: unknown noid
    patch:
      summary: Update a compilation
      tags:
      - Compilations
      description: |
        Title/description edits plus an optional `permissions` ACL hash
        (read/edit groups + edit_users — replaces all three lists; the
        depositor is never writable). ACL changes emit a `permissions`
        audit event with before/after; no-op ACL writes are suppressed.
      security:
      - BearerAuth: []
        NuidHeader: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: edit_users grant lets a non-owner update
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '403':
          description: non-owner without a grant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                permissions:
                  type: object
                  properties:
                    read:
                      type: array
                      items:
                        type: string
                    edit:
                      type: array
                      items:
                        type: string
                    edit_users:
                      type: array
                      items:
                        type: string
    delete:
      summary: Destroy a compilation
      tags:
      - Compilations
      description: Owner (or edit-grantee / admin) only. Join rows cascade.
      security:
      - BearerAuth: []
        NuidHeader: []
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: compilation destroyed
        '403':
          description: non-owner cannot destroy
        '404':
          description: unknown noid
