      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata[title]:
                  type: string
                metadata[description]:
                  type: string
                binary:
                  type: string
                  format: binary
                  description: MODS XML to apply to the Work
      responses:
        '200':
          description: work updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict on the generic metadata update (surfaced
            immediately, not retried)
    delete:
      summary: Destroy a work
      tags:
      - Works
      responses:
