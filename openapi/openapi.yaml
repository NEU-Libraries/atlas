      parameters: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: MODS XML to apply to the Community
      responses:
        '200':
          description: community updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
    delete:
      summary: Destroy a community
      tags:
      - Communities
      responses:
        '204':
          description: community destroyed
  "/communities/{id}/mods":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Retrieve MODS metadata for a community
      tags:
      - Communities
      responses:
        '200':
          description: mods returned
  "/communities/{id}/children":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List child noids of a community
      tags:
      - Communities
      responses:
        '200':
          description: children listed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '410':
          description: community tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
  "/communities/{id}/ancestors":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List ancestors of a community
      tags:
      - Communities
      description: Returns the ancestor chain as an array of [noid, type-name] pairs.
      responses:
        '200':
          description: ancestors listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Lineage"
        '410':
          description: community tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
  "/communities/{id}/thumbnails":
    parameters:
    - name: id
      in: path
      description: NOID of the Community
      required: true
      schema:
        type: string
    patch:
      summary: Attach thumbnail-family IIIF Delegate URIs to a community
      tags:
      - Communities
      description: |
        Upserts one or more thumbnail-tier Delegates on the Community
        (85px `thumbnail`, 170px `thumbnail_2x`, 500px `preview`). Missing
        keys are left untouched. Mirrors the Works endpoint of the same
        shape; community-level thumbnails surface in the Cerberus
        browse UI.
      parameters: []
      responses:
        '200':
          description: all three thumbnail-family keys land in one PATCH
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  description: IIIF URL for the 85px thumbnail tier
                thumbnail_2x:
                  type: string
                  description: IIIF URL for the 170px retina thumbnail tier
                preview:
                  type: string
                  description: IIIF URL for the 500px hero preview tier
  "/communities/{id}/parent":
    parameters:
    - name: id
      in: path
      description: NOID of the Community to move
      required: true
      schema:
        type: string
    patch:
      summary: Re-parent a community
      tags:
      - Communities
      description: |
        Moves a Community under a different parent Community, or to the top of
        the tree (omit `parent_id` or pass null). Re-projects the moved
        subtree's descendant collections and sub-communities so their cached
        ancestry stays correct; Works are never touched. Rejects cycles, bad
        parent types, and tombstoned node/parent with a 422.
      parameters: []
      responses:
        '200':
          description: community moved to the top of the tree (null parent)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
        '422':
          description: rejects an invalid parent type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  nullable: true
                  description: NOID of the new parent Community, or null for top-level
  "/communities/{id}/tombstone":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Tombstone a community
      tags:
      - Communities
      description: Marks a Community as tombstoned. Refuses with 422 if the community
        has live (non-tombstoned) members.
      responses:
        '200':
          description: community tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Community"
        '422':
          description: community has live members
