          required:
          - id
          - valkyrie_id
          - ancestors
          - ancestor_chain
          - thumbnail
          - thumbnail_2x
          - preview
          - title
          - description
          - permanent_url
          - tombstoned
          - tombstoned_at
          - tombstoned_by
          - depositor
          - proxy_uploader
          - featured
          - personal_root
      required:
      - collection
