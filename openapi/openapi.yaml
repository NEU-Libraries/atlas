    UserDirectoryEntry:
      type: object
      properties:
        nuid:
          type: string
        name:
          type: string
          nullable: true
      required:
      - nuid
      - name
    UserDirectory:
      type: array
      items:
        "$ref": "#/components/schemas/UserDirectoryEntry"
    UserAccounts:
      type: object
      properties:
        nuid:
          type: string
        accounts:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
              name:
                type: string
                nullable: true
              affiliation:
                type: string
                nullable: true
              role:
                type: string
              groups:
                type: array
                items:
                  type: string
              preferred:
                type: boolean
            required:
            - email
            - name
            - affiliation
            - role
            - groups
            - preferred
      required:
      - nuid
      - accounts
    Permissions:
      type: object
      properties:
        resource:
          type: object
          properties: {}
          required: []
          additionalProperties: true
          description: Permission flags merged from Resource#permissions
      required:
      - resource
    ResourceRef:
      oneOf:
      - "$ref": "#/components/schemas/Work"
      - "$ref": "#/components/schemas/Collection"
      - "$ref": "#/components/schemas/Community"
      - "$ref": "#/components/schemas/FileSet"
      - "$ref": "#/components/schemas/Delegate"
    ResourceDigests:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: NOID
          noid:
            type: string
            description: NOID (same value as id; explicit for batch callers indexing
              by noid)
          klass:
            type: string
            description: Resolved resource class name
          title:
            type: string
            nullable: true
            description: Plain-text title; null off the Modsable backbone
          thumbnail:
            type: string
            nullable: true
            description: IIIF URL of the thumbnail tier, or null
          tombstoned:
            type: boolean
            description: Withdrawn-from-discovery flag — kept in the result but flagged
        required:
        - id
        - noid
        - klass
        - title
        - thumbnail
        - tombstoned
    Lineage:
      type: array
      description: Ancestor chain, root-first — array of {noid, klass, title} objects
      items:
        type: object
        properties:
          noid:
            type: string
            description: Ancestor NOID
          klass:
            type: string
            description: Ancestor resource class name
          title:
            type: string
            description: Ancestor plain-text title (may be empty)
        required:
        - noid
        - klass
        - title
    ModsVersions:
      type: object
      properties:
        resource_id:
          type: string
          description: NOID of the resource
        versions:
          type: array
          items:
            type: object
            properties:
              version_id:
                type: string
                description: OCFL version label (vN); stable and sortable
              created:
                type: string
                format: date-time
                description: OCFL version creation timestamp (ISO-8601)
              actor_nuid:
                type: string
                nullable: true
                description: Editing NUID, correlated from the audit log; null when
                  uncorrelatable
              on_behalf_of_nuid:
                type: string
                nullable: true
                description: Impersonation target NUID from the correlated event;
                  usually null
              source:
                type: string
                nullable: true
                description: 'Edit source from the correlated event: ''mods'' (full
                  doc) or ''fields'' (field patch)'
              note:
                type: string
                nullable: true
                description: Optional rationale from the correlated event
            required:
            - version_id
            - created
            - actor_nuid
            - on_behalf_of_nuid
            - source
            - note
      required:
      - resource_id
      - versions
    BlobVersions:
      type: object
      properties:
        blob_id:
          type: string
          description: NOID of the Blob
        versions:
          type: array
          items:
            type: object
            properties:
              revision:
                type: integer
                description: Contiguous 1-based content-revision ordinal (the primary
                  label); revision 1 is the seed. Never skips, unlike version_id.
              version_id:
                type: string
                description: Raw OCFL version label (vN); secondary/debug. Can jump
                  (v1 → v4) because preservation-envelope bumps consume OCFL versions.
              file_identifier:
                type: string
                description: Versioned Valkyrie::ID appended for this revision
              created:
                type: string
                format: date-time
                description: OCFL version creation timestamp (ISO-8601)
              actor_nuid:
                type: string
                nullable: true
                description: NUID that wrote this revision, correlated from the file
                  audit log; null when uncorrelatable
              on_behalf_of_nuid:
                type: string
                nullable: true
                description: Impersonation target NUID from the correlated event;
                  usually null
              digest:
                type: string
                nullable: true
                description: Fixity as recorded at that version, "<algorithm>:<hexvalue>"
              size:
                type: integer
                nullable: true
                description: Byte size of this revision
              original_filename:
                type: string
                nullable: true
                description: Stable original filename (preserved across revisions)
            required:
            - revision
            - version_id
            - file_identifier
            - created
            - actor_nuid
            - on_behalf_of_nuid
            - digest
            - size
            - original_filename
      required:
      - blob_id
      - versions
    BlobAncestry:
      type: object
      properties:
        file_set:
          type: string
          nullable: true
          description: NOID of the parent FileSet; null when unresolvable
        work:
          type: string
          nullable: true
          description: NOID of the containing Work; null when unresolvable
      required:
      - file_set
      - work
    DescendantWorks:
      type: object
      properties:
        works:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: NOID
              noid:
                type: string
                description: NOID (same value as id; find_many digest parity)
              klass:
                type: string
                description: Resolved resource class name (always Work here)
              title:
                type: string
                nullable: true
                description: Plain-text title off the Solr doc
              thumbnail:
                type: string
                nullable: true
                description: IIIF URL of the thumbnail tier, or null
            required:
            - id
