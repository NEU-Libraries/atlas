      required:
      - resource
    ResourceRef:
      oneOf:
      - "$ref": "#/components/schemas/Work"
      - "$ref": "#/components/schemas/Collection"
      - "$ref": "#/components/schemas/Community"
      - "$ref": "#/components/schemas/FileSet"
      - "$ref": "#/components/schemas/Delegate"
    ResourceDigests:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: NOID
          noid:
            type: string
            description: NOID (same value as id; explicit for batch callers indexing
              by noid)
          klass:
            type: string
            description: Resolved resource class name
          title:
            type: string
            nullable: true
            description: Plain-text title; null off the Modsable backbone
          thumbnail:
            type: string
            nullable: true
            description: IIIF URL of the thumbnail tier, or null
          tombstoned:
            type: boolean
            description: Withdrawn-from-discovery flag — kept in the result but flagged
        required:
        - id
        - noid
        - klass
        - title
        - thumbnail
        - tombstoned
    Lineage:
      type: array
      items:
        type: array
        items:
          type: string
        minItems: 2
        maxItems: 2
        description: "[noid, type-name] pair"
      description: Ancestor or descendant chain — array of [noid, type-name] pairs
paths:
  "/files":
    get:
      summary: List files
      tags:
      - Files
      responses:
        '200':
          description: files listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobsIndex"
    post:
      summary: Upload a file
      tags:
      - Files
      description: |
        Uploads a binary as a Blob attached to a Work.

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created Blob without re-uploading. 410 + tombstone
        payload if the underlying Blob has been tombstoned.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                work_id:
                  type: string
                  description: NOID of the parent Work
                original_filename:
                  type: string
                binary:
                  type: string
                  format: binary
                  description: File bytes to upload
              required:
              - work_id
              - binary
      responses:
        '200':
          description: idempotent replay returns existing blob
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '410':
          description: idempotent replay on a tombstoned blob
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
  "/files/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Retrieve file metadata
      tags:
      - Files
      responses:
        '200':
          description: file found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '410':
          description: file tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
    patch:
      summary: Append a new revision to a file
      tags:
      - Files
      description: 'Uber-basic versioning: posts a new binary, appends its file identifier
        to the Blob.'
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: New revision bytes
              required:
              - binary
      responses:
        '200':
          description: revision appended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
    delete:
      summary: Destroy a file
      tags:
      - Files
      responses:
        '204':
          description: file destroyed
  "/files/{id}/content":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Stream file content bytes
      tags:
      - Files
      description: Streams the underlying bytes via send_file with attachment disposition.
        Memory-safe for large files.
      responses:
        '200':
          description: content streamed
  "/collections":
    get:
      summary: List collections
      tags:
      - Collections
      responses:
        '200':
          description: collections listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CollectionsIndex"
    post:
      summary: Create a collection
      tags:
      - Collections
      description: |
        Creates a Collection as a child of the given Community.

        Optional `depositor` is the NUID to stamp as the intellectual
        owner — the same anonymous-batch configuration shape that
        `WorksController#create` supports for inheriting Work-level
        depositors.
      parameters: []
      responses:
        '200':
          description: create with explicit depositor stamps the resource
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  description: NOID of the parent Community
                depositor:
                  type: string
                  description: NUID to stamp as the Collection depositor (optional)
              required:
              - parent_id
  "/collections/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Collection
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a collection
      tags:
      - Collections
      responses:
        '200':
          description: collection found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
        '410':
          description: collection tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
    patch:
      summary: Update a collection
      tags:
      - Collections
      description: |
        Update descriptive metadata on a Collection. Either supply a
        `binary` MODS XML upload or `metadata[*]` form fields.

        Thumbnail-family URI writes have their own purpose-specific
        endpoint — see `PATCH /collections/{id}/thumbnails`.
