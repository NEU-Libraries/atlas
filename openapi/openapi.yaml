    post:
      summary: Mint a JWT for a NUID (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus to mint a per-user JWT.
        Requires the system Bearer token; non-system callers receive 403.
      parameters: []
      responses:
        '403':
          description: caller is not the system user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nuid:
                  type: string
              required:
              - nuid
  "/users/by_nuid/{nuid}":
    put:
      summary: Find-or-create a user and replace their groups (system-only)
      tags:
      - User
      description: |
        System-only endpoint used by Cerberus on SSO callback. Idempotent
        on NUID; replaces (not merges) the supplied groups onto the user.
        Requires the system Bearer token (no `User:` header); non-system
        callers receive 403.
      security:
      - BearerAuth: []
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: User
        in: header
        required: false
        description: Acting principal, e.g. "NUID 000000000" for the system user
        schema:
          type: string
      responses:
        '200':
          description: user upserted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
        '403':
          description: caller is not the system user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    type: string
                email:
                  type: string
                name:
                  type: string
