      - blob
    Delegate:
      type: object
      properties:
        delegate:
          type: object
          properties:
            id:
              type: string
              description: NOID
            valkyrie_id:
              type: string
              description: Valkyrie internal id
            use:
              type: string
              nullable: true
            uri:
              type: string
              nullable: true
              description: Where the asset can be fetched (IIIF URL for image roles)
            mime_type:
              type: string
              nullable: true
            original_filename:
              type: string
              nullable: true
            label:
