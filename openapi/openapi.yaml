      properties:
        file_set:
          type: string
          nullable: true
          description: NOID of the parent FileSet; null when unresolvable
        work:
          type: string
          nullable: true
          description: NOID of the containing Work; null when unresolvable
      required:
      - file_set
      - work
    Compilation:
      type: object
      properties:
        compilation:
          type: object
          properties:
            id:
              type: string
              description: NOID (minted; the API-addressable id)
            title:
              type: string
            description:
              type: string
              nullable: true
            depositor:
              type: string
              description: Curator NUID (owner)
            included_collections:
              type: array
              items:
                type: string
              description: Collection noids included transitively (self + descendants)
            included_works:
              type: array
              items:
                type: string
              description: Work noids included individually
            excluded_works:
              type: array
              items:
                type: string
              description: Work noids set aside (subtracted from the resolved union)
            edit_users:
              type: array
              items:
                type: string
            read_groups:
              type: array
              items:
                type: string
            edit_groups:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
          required:
          - id
          - title
          - description
          - depositor
          - included_collections
          - included_works
          - excluded_works
          - edit_users
          - read_groups
          - edit_groups
          - created_at
          - updated_at
      required:
      - compilation
    CompilationsIndex:
      type: object
      properties:
        compilations:
          type: array
          items:
            "$ref": "#/components/schemas/Compilation"
        pagination:
          "$ref": "#/components/schemas/Pagination"
      required:
      - compilations
      - pagination
    CompilationContents:
      type: object
      properties:
        contents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: NOID
              noid:
                type: string
                description: NOID (same value as id; find_many digest parity)
              klass:
                type: string
                description: Resolved resource class name (always Work here)
              title:
                type: string
                nullable: true
                description: Plain-text title off the Solr doc
              thumbnail:
                type: string
                nullable: true
                description: IIIF URL of the thumbnail tier, or null
            required:
            - id
            - noid
            - klass
            - title
            - thumbnail
        pagination:
          "$ref": "#/components/schemas/Pagination"
      required:
      - contents
      - pagination
    Person:
      type: object
      properties:
        person:
          type: object
          properties:
            id:
              type: string
              description: NOID
            valkyrie_id:
              type: string
              description: Valkyrie internal id
            nuid:
              type: string
              description: Correlation key + public address
            display_name:
              type: string
              description: Authoritative, librarian-editable name
            bio:
              type: string
              nullable: true
            orcid:
              type: string
              nullable: true
            title:
              type: string
              nullable: true
            affiliated_community_ids:
              type: array
              items:
                type: string
              description: NOIDs of affiliated communities
            personal_root_id:
              type: string
              nullable: true
              description: NOID of the Person's personal-root Collection (the publish
                conduit's structural parent)
          required:
          - id
          - valkyrie_id
          - nuid
          - display_name
          - bio
          - orcid
          - title
          - affiliated_community_ids
          - personal_root_id
      required:
      - person
    PeopleIndex:
      type: object
      properties:
        people:
          type: array
          items:
            "$ref": "#/components/schemas/Person"
        pagination:
          "$ref": "#/components/schemas/Pagination"
      required:
      - people
      - pagination
paths:
  "/files":
    get:
      summary: List files
      tags:
      - Files
      responses:
        '200':
          description: files listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobsIndex"
    post:
      summary: Upload a file
      tags:
      - Files
      description: |
        Uploads a binary as a Blob attached to a Work.

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created Blob without re-uploading. 410 + tombstone
        payload if the underlying Blob has been tombstoned.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                work_id:
                  type: string
                  description: NOID of the parent Work
                original_filename:
                  type: string
                expected_digest:
                  type: string
                  description: Optional verify-on-ingest checksum, "<algorithm>:<hexvalue>"
                    (sha512/sha256/sha1/md5). Rejected 422 if the bytes do not match.
                binary:
                  type: string
                  format: binary
                  description: File bytes to upload
              required:
              - work_id
              - binary
      responses:
        '200':
          description: idempotent replay returns existing blob
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '422':
          description: verify-on-ingest rejects a digest mismatch (nothing persisted)
        '410':
          description: idempotent replay on a tombstoned blob
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
  "/files/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Retrieve file metadata
      tags:
      - Files
      responses:
        '200':
          description: file found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '410':
          description: file tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
    patch:
      summary: Append a new revision to a file
      tags:
      - Files
      description: |
        Uber-basic versioning: posts a new binary, appends its file identifier
        to the Blob (NOID preserved, prior bytes retained by OCFL).

        Idempotent on the optional `Idempotency-Key` header: a double-submit of
        the replace form with the same key returns the existing Blob instead of
        minting a second OCFL version.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource without
          a new revision.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: New revision bytes
                expected_digest:
                  type: string
                  description: Optional verify-on-ingest checksum, "<algorithm>:<hexvalue>".
                    422 on mismatch.
              required:
              - binary
      responses:
        '200':
          description: revision appended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
    delete:
      summary: Destroy a file
      tags:
      - Files
      responses:
        '204':
          description: file destroyed
  "/files/{id}/content":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Stream file content bytes
      tags:
      - Files
      description: |
        Streams the underlying bytes with attachment disposition; memory-safe
        for large files. Supports HTTP Range for seekable A/V playback:
        `Accept-Ranges: bytes` is always advertised, a single `Range:
        bytes=START-END` request is answered `206 Partial Content` with
        `Content-Range`, and a syntactically-valid but unsatisfiable range is
        rejected `416`. Multi-range is not supported; an absent or unparseable
        Range serves the full `200` body.
      parameters:
      - name: Range
        in: header
        required: false
        description: Optional single byte range, e.g. `bytes=0-1048575`. Triggers
          a 206 Partial Content response.
        schema:
          type: string
      responses:
        '200':
          description: content streamed (whole body)
        '206':
          description: partial content (byte range)
        '416':
          description: range not satisfiable
  "/files/{id}/ancestry":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Resolve a file to its parent FileSet and Work
      tags:
      - Files
      description: |
        Resolves a content Blob to its parent FileSet and containing Work noids
        (`{ "file_set": "<noid>", "work": "<noid>" }`). The download path is
        keyed only by the blob id, so a consumer recording a download/stream
        impression against the containing Work resolves it here rather than
        threading the work noid through the download URL. Reads on the Blob
        floor. Unknown id → 404; either value is null when unresolvable (e.g.
        an orphan blob with no FileSet parent).
      responses:
        '200':
          description: ancestry resolved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobAncestry"
        '404':
          description: unknown blob
  "/files/{id}/versions":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: List binary version history for a file
      tags:
      - Files
      description: |
        Reverse-chronological list of the Blob's retained content revisions —
        the counterpart to `GET /resources/{id}/mods/versions`. Each descriptor
        carries the OCFL version label, its file identifier, the fixity
        `digest`/`size` recorded at that version, and actor attribution
        correlated from the file audit log (`actor_nuid` etc. are null when no
        event matches, e.g. a back-loaded Blob).

        Admin-gated, like the MODS version list, because the descriptors expose
        edit attribution. Unknown id → 404.
      responses:
        '200':
          description: versions listed (newest first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobVersions"
        '404':
          description: unknown blob
  "/files/{id}/versions/{version_id}/content":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    - name: version_id
      in: path
      description: OCFL version label, e.g. v1
      required: true
      schema:
        type: string
    get:
      summary: Stream a prior version’s content bytes
      tags:
      - Files
      description: |
        Streams the bytes of a retained version, pinned to its OCFL label.
        Mirrors `GET /files/{id}/content` (same memory-safe send_file path) but
        resolves through the version history, so only listed content revisions
        are addressable. Unknown id or version → 404.
      responses:
        '200':
          description: version content streamed
        '404':
          description: unknown version
  "/files/{id}/rollback":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    post:
      summary: Roll a file back to a prior version
      tags:
      - Files
      description: |
        Promote a prior version to current by appending its bytes again as a
        new revision (non-destructive — it becomes vN+1 with the bytes of vN),
        keeping the Blob NOID. OCFL dedups the identical content. Unknown id or
        version → 404.
      parameters: []
      responses:
        '200':
          description: rolled back (new revision appended)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '404':
          description: unknown version
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id:
                  type: string
                  description: OCFL version label to reinstate, e.g. v1
              required:
              - version_id
  "/collections":
    get:
      summary: List collections
      tags:
      - Collections
      responses:
        '200':
          description: collections listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CollectionsIndex"
    post:
      summary: Create a collection
      tags:
      - Collections
      description: |
        Creates a Collection as a child of the given Community.

        Optional `depositor` is the NUID to stamp as the intellectual
        owner — the same anonymous-batch configuration shape that
        `WorksController#create` supports for inheriting Work-level
        depositors.
      parameters: []
      responses:
        '200':
          description: create with explicit depositor stamps the resource
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  description: NOID of the parent Community
                depositor:
                  type: string
                  description: NUID to stamp as the Collection depositor (optional)
                featured:
                  type: boolean
                  description: Mark as a genre-showcase ("Featured") Collection (optional)
              required:
              - parent_id
  "/collections/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Collection
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a collection
      tags:
      - Collections
      responses:
        '200':
          description: collection found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
        '410':
          description: collection tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
    patch:
      summary: Update a collection
      tags:
      - Collections
      description: |
        Update a Collection's descriptive metadata by supplying a `binary`
        MODS XML upload — the caller assembles the full document (descriptive
        merge logic lives in the client, not Atlas). `metadata[permissions]`
        adjusts the ACL. Any `metadata[title]` / `metadata[description]` keys
        are ignored.

        Thumbnail-family URI writes have their own purpose-specific
        endpoint — see `PATCH /collections/{id}/thumbnails`.
      parameters: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: string
        description: Toggle the showcase "Featured" flag ("true"/"false")
      responses:
        '200':
          description: toggle the Featured showcase flag
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
    delete:
      summary: Destroy a collection
      tags:
      - Collections
      responses:
        '204':
          description: collection destroyed
  "/collections/{id}/mods":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Retrieve MODS metadata for a collection
      tags:
      - Collections
      responses:
        '200':
          description: mods returned
  "/collections/{id}/children":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List child noids of a collection
      tags:
      - Collections
      responses:
        '200':
          description: children listed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '410':
          description: collection tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
  "/collections/{id}/ancestors":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List ancestors of a collection
      tags:
      - Collections
      description: Returns the ancestor chain as an array of [noid, type-name] pairs.
      responses:
        '200':
          description: ancestors listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Lineage"
        '410':
          description: collection tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
  "/collections/{id}/thumbnails":
    parameters:
    - name: id
      in: path
      description: NOID of the Collection
      required: true
      schema:
        type: string
    patch:
      summary: Attach thumbnail-family IIIF Delegate URIs to a collection
      tags:
      - Collections
      description: |
        Upserts one or more thumbnail-tier Delegates on the Collection
        (85px `thumbnail`, 170px `thumbnail_2x`, 500px `preview`). Missing
        keys are left untouched. Mirrors the Works endpoint of the same
        shape; collection-level thumbnails surface in the Cerberus
        browse UI.
      parameters: []
      responses:
        '200':
          description: all three thumbnail-family keys land in one PATCH
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  description: IIIF URL for the 85px thumbnail tier
                thumbnail_2x:
                  type: string
                  description: IIIF URL for the 170px retina thumbnail tier
                preview:
                  type: string
                  description: IIIF URL for the 500px hero preview tier
  "/collections/{id}/parent":
    parameters:
    - name: id
      in: path
      description: NOID of the Collection to move
      required: true
      schema:
        type: string
    patch:
      summary: Re-parent a collection
      tags:
      - Collections
      description: |
        Moves a Collection under a different parent Community or Collection.
        Re-projects the moved subtree's descendant collections so their cached
        ancestry stays correct; Works are never touched. Rejects cycles (the
        new parent being the collection itself or one of its descendants), bad
        parent types, and tombstoned node/parent with a 422.
      parameters: []
      responses:
        '200':
          description: collection moved under another collection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
        '422':
          description: rejects a move into the collection's own descendant (cycle)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - parent_id
              properties:
                parent_id:
                  type: string
                  description: NOID of the new parent Community or Collection
  "/collections/{id}/tombstone":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Tombstone a collection
      tags:
      - Collections
      description: Marks a Collection as tombstoned. Refuses with 422 if the collection
        has live (non-tombstoned) members.
      responses:
        '200':
          description: collection tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
        '422':
          description: collection has live members
  "/collections/{id}/restore":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Restore a tombstoned collection
      tags:
      - Collections
      description: Clears the tombstone flag on a Collection. Cerberus does not expose
        this — call from operator console.
      responses:
        '200':
          description: collection restored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Collection"
  "/communities":
    get:
      summary: List communities
      tags:
      - Communities
      responses:
        '200':
          description: communities listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommunitiesIndex"
    post:
      summary: Create a community
      tags:
      - Communities
      description: |
        Creates a Community. `parent_id` is optional — top-level
        communities have no parent. Optional `depositor` is the NUID to
