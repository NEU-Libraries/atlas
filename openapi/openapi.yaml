      properties:
        collections:
          type: array
          items:
            "$ref": "#/components/schemas/CollectionSummary"
        pagination:
          "$ref": "#/components/schemas/Pagination"
      required:
      - collections
      - pagination
    CommunitiesIndex:
      type: object
      properties:
        communities:
          type: array
          items:
            "$ref": "#/components/schemas/CommunitySummary"
        pagination:
