        total:
          type: integer
          description: Items in the whole list.
        page:
          type: integer
          description: This page's number, from 1.
        per_page:
          type: integer
          description: The page size.
        pages:
          type: integer
          description: Pages in the whole list; 0 when it is empty.
      required:
      - total
      - page
      - per_page
      - pages
