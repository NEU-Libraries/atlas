  "/compilations":
    get:
      summary: List compilations (owner- or grant-scoped)
      tags:
      - Compilations
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      - name: owner
        in: query
        required: false
        description: NUID whose Sets to list (admin-only); defaults to the caller.
          Ignored when scope is given.
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - editable
          - shared
        description: 'grant-scoped mode: editable (edit grants) or shared (read+edit
          grants), both excluding owned Sets'
      - name: q
        in: query
        required: false
        description: case-insensitive title substring filter
        schema:
          type: string
      description: |
        Paginated listing of Compilations, ordered by title A to Z, ignoring
        case. Three modes:

