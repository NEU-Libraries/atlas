paths:
  "/files":
    get:
      summary: List files
      tags:
      - Files
      description: |
        Lists every Blob, one page at a time. A row is a file's metadata, not its
        bytes; read the bytes from `GET /files/{id}/content`.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      responses:
        '200':
          description: files listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobsIndex"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_index
    post:
      summary: Upload a file
      tags:
      - Files
      description: |
        Uploads a binary as a Blob attached to a Work.

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created Blob without re-uploading. 410 + tombstone
        payload if the underlying Blob has been tombstoned.

        `language` and `track_label` describe a caption or other text track.
        A malformed `language` is refused `422 invalid_language`, and a
        `track_label` over 64 characters `422 invalid_track_label`, before
        anything is stored.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                work_id:
                  type: string
                  description: NOID of the parent Work
                original_filename:
                  type: string
                expected_digest:
                  type: string
                  description: Optional verify-on-ingest checksum, "<algorithm>:<hexvalue>"
                    (sha512/sha256/sha1/md5). Rejected 422 if the bytes do not match.
                language:
                  type: string
                  description: BCP 47 language of a caption or other text track (e.g.
                    en, es-MX)
                track_label:
                  type: string
                  description: Display name a player shows for the track, at most
                    64 characters
                binary:
                  type: string
                  format: binary
                  description: File bytes to upload
              required:
              - work_id
              - binary
      responses:
        '200':
          description: idempotent replay returns existing blob
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '422':
          description: verify-on-ingest rejects a digest mismatch (nothing persisted)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '410':
          description: idempotent replay on a tombstoned blob
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_create
  "/files/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Retrieve file metadata
      tags:
      - Files
      description: |
        Returns a Blob's metadata: its name, type, size and digest. Read the bytes
        from `GET /files/{id}/content`.

        A tombstoned Blob answers `410`: an admin or delegated admin gets the full
        record, and everyone else gets the `Tombstoned` body.
      responses:
        '200':
          description: file found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '410':
          description: 'tombstoned: the Blob to admins and delegated admins, Tombstoned
            to everyone else'
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Blob"
                - "$ref": "#/components/schemas/Tombstoned"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_show
    patch:
      summary: Append a new revision to a file
      tags:
      - Files
      description: |
        Uber-basic versioning: posts a new binary, appends its file identifier
        to the Blob (NOID preserved, prior bytes retained by OCFL).

        `size`, `mime_type` and `digest` are re-derived from the new bytes, so a
        consumer can set Content-Length and serve Range requests from the
        response.

        An `original_filename` renames the file from this revision on, which is
        how a replacement of a different type (a `.docx` replaced by a `.pdf`)
        downloads under the right extension. Each revision keeps its own name,
        so `GET /files/{id}/versions` lists them and a rollback restores one.
        For the original file, `label` and the FileSet's classification follow
        the new type; a derivative keeps its tier label.

        Idempotent on the optional `Idempotency-Key` header: a double-submit of
        the replace form with the same key returns the existing Blob instead of
        minting a second OCFL version.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource without
          a new revision.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: New revision bytes
                original_filename:
                  type: string
                  description: The replacement's own filename. Omit it to keep the
                    current name.
                expected_digest:
                  type: string
                  description: Optional verify-on-ingest checksum, "<algorithm>:<hexvalue>".
                    422 on mismatch.
                language:
                  type: string
                  description: BCP 47 language of the track. Omit to keep it; send
                    an empty value to clear it.
                track_label:
                  type: string
                  description: Display name for the track. Omit to keep it; send an
                    empty value to clear it.
              required:
              - binary
      responses:
        '200':
          description: revision appended
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '404':
          description: file not found
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_update
    delete:
      summary: Destroy a file
      tags:
      - Files
      description: |
        Permanently removes the Blob's metadata record **and** its bytes,
        taking the whole OCFL object with it — every retained revision, not
        only the current one. Cannot be reversed. Unlinks the Blob from its
        FileSet and rebuilds that FileSet's METS.

        Admin only.
      responses:
        '204':
          description: file destroyed
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_destroy
  "/files/{id}/content":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Stream file content bytes
      tags:
      - Files
      description: |
        Streams the underlying bytes with attachment disposition; memory-safe
        for large files. Supports HTTP Range for seekable A/V playback:
        `Accept-Ranges: bytes` is always advertised, a single `Range:
        bytes=START-END` request is answered `206 Partial Content` with
        `Content-Range`, and a syntactically-valid but unsatisfiable range is
        rejected `416`. Multi-range is not supported; an absent or unparseable
        Range serves the full `200` body.

        When the Blob, its FileSet or its Work is tombstoned, the bytes are
        withheld with `410 tombstoned`, which names the tombstoned resource.
        Admins and delegated admins are still served, so they can review a
        removed file before they restore it.

        The bytes are also withheld with `403` while the Work is under
        embargo, except from admins and repository staff, and when the
        file's tier (`derivative_permissions`) is reserved to groups the
        caller is not in, except from admins and anyone with an edit grant
        on the Work. The Work's metadata stays readable in both cases, and
        `GET /works/{id}/assets` reports the tier as `gated`.
      parameters:
      - name: Range
        in: header
        required: false
        description: Optional single byte range, e.g. `bytes=0-1048575`. Triggers
          a 206 Partial Content response.
        schema:
          type: string
      responses:
        '200':
          description: content streamed (whole body)
        '206':
          description: partial content (byte range)
        '416':
          description: range not satisfiable
        '410':
          description: content withheld by a tombstoned Work
          content: {}
        '403':
          description: content withheld by an embargo or a tier reservation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_content
  "/files/{id}/ancestry":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: Resolve a file to its parent FileSet and Work
      tags:
      - Files
      description: |
        Resolves a content Blob to its parent FileSet and containing Work noids
        (`{ "file_set": "<noid>", "work": "<noid>" }`). The download path is
        keyed only by the blob id, so a consumer recording a download/stream
        impression against the containing Work resolves it here rather than
        threading the work noid through the download URL. Reads on the Blob
        floor. Unknown id → 404; either value is null when unresolvable (e.g.
        an orphan blob with no FileSet parent).
      responses:
        '200':
          description: ancestry resolved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobAncestry"
        '404':
          description: unknown blob
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_ancestry
  "/files/{id}/versions":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    get:
      summary: List binary version history for a file
      tags:
      - Files
      description: |
        Reverse-chronological list of the Blob's retained content revisions —
        the counterpart to `GET /resources/{id}/mods/versions`. Each descriptor
        carries a contiguous `revision` ordinal (the primary label: revision 1
        is the seed, and it never skips), the raw OCFL `version_id`
        (secondary/debug — it can jump, e.g. `v1 → v4`, because
        preservation-envelope bumps consume OCFL versions), its file
        identifier, the fixity `digest`/`size` recorded at that version, and
        actor attribution correlated from the file audit log (`actor_nuid` etc.
        are null when no event matches, e.g. a back-loaded Blob).

        Admin-gated, like the MODS version list, because the descriptors expose
        edit attribution (the devolved-admin tier — :privileged role + the
        repository:admin group — can also reach this). Unknown id → 404.
      responses:
        '200':
          description: versions listed (newest first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobVersions"
        '404':
          description: unknown blob
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_versions
  "/files/find_many_versions":
    post:
      summary: List binary version history for many files in one round-trip
      tags:
      - Files
      description: |
        The batched counterpart to `GET /files/{id}/versions`: one envelope per
        Blob, of exactly that shape, for a set of ids in a single request. Use
        it wherever a set of Blob noids would otherwise be resolved with a
        `versions`-per-noid fan-out — a Work's replaceable-file listing reads
        every held Blob on the Work, which on a multipage Work is one request
        per page binary.

        The result is **unordered** and **may be shorter than the input**: an id
        that resolves to nothing, or to a resource that is not a Blob, is
        dropped silently. Callers index by `blob_id`.

        Admin-gated exactly like the single read (the devolved-admin tier —
        :privileged role + the repository:admin group — reaches it too), because
        the descriptors expose the same edit attribution. The grant is
        class-wide, so nothing is dropped for authorization.
      parameters: []
      responses:
        '200':
          description: empty id list returns an empty array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlobVersionsBatch"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Blob NOIDs
              required:
              - ids
      operationId: blobs_find_many_versions
  "/files/{id}/versions/{version_id}/content":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    - name: version_id
      in: path
      description: OCFL version label, e.g. v1
      required: true
      schema:
        type: string
    get:
      summary: Stream a prior version’s content bytes
      tags:
      - Files
      description: |
        Streams the bytes of a retained version, pinned to its OCFL label.
        Mirrors `GET /files/{id}/content` (same memory-safe send_file path) but
        resolves through the version history, so only listed content revisions
        are addressable. Unknown id or version → 404. A tombstone, an embargo
        and a tier reservation withhold a prior version exactly as they
        withhold the current one.
      responses:
        '200':
          description: version content streamed
        '404':
          description: unknown version
        '403':
          description: version content withheld by an embargo or a tier reservation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: blobs_version_content
  "/files/{id}/rollback":
    parameters:
    - name: id
      in: path
      description: NOID of the Blob
      required: true
      schema:
        type: string
    post:
      summary: Roll a file back to a prior version
      tags:
      - Files
      description: |
        Promote a prior version to current by appending its bytes again as a
        new revision (non-destructive — it becomes vN+1 with the bytes of vN),
        keeping the Blob NOID. OCFL dedups the identical content. Unknown id or
        version → 404.
      parameters: []
      responses:
        '200':
          description: rolled back (new revision appended)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Blob"
        '404':
          description: unknown version
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id:
                  type: string
                  description: OCFL version label to reinstate, e.g. v1
              required:
              - version_id
      operationId: blobs_rollback
