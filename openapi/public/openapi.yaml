        resolved union at read time. The noid must resolve to a Work. Idempotent.'
      parameters: []
      responses:
        '200':
          description: work set aside
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id:
                  type: string
                  description: Work NOID
              required:
              - work_id
      operationId: compilations_add_exclusion
  "/compilations/{id}/exclusions/{work_id}":
    parameters:
    - name: id
      in: path
      description: Compilation NOID
      required: true
      schema:
        type: string
    - name: work_id
      in: path
      description: Work NOID
      required: true
      schema:
        type: string
    delete:
      summary: Clear a set-aside
      tags:
      - Compilations
      description: 'Idempotent: clearing an absent set-aside is a 200 no-op.'
      responses:
        '200':
          description: set-aside cleared
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: compilations_remove_exclusion
  "/compilations/{id}/published":
    parameters:
    - name: id
      in: path
      description: Compilation NOID
      required: true
      schema:
        type: string
    post:
      summary: Publish the Set to OAI-PMH
      tags:
      - Compilations
      description: |
        Makes the Set an OAI-PMH set: `GET /oai?verb=ListSets` lists it, and any
        harvester can walk its Works. Admin-only — publishing is an external
        commitment, so edit rights on the Set are not enough. Idempotent; a
        re-publish emits no audit row.

        Once published, the recipe routes start emitting `structural` audit rows,
        because a Work entering or leaving the feed is a curatorial act.
      responses:
        '200':
          description: set published
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '403':
          description: owner without admin is refused
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: compilations_publish
    delete:
      summary: Remove the Set from OAI-PMH
      tags:
      - Compilations
      description: Clears the flag; ListSets stops advertising it. Admin-only. Harvesters
        that already copied the Set are NOT told — OAI deletion is per record, and
        this removes the set, not its Works.
      responses:
        '200':
          description: set removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: compilations_unpublish
  "/compilations/{id}/contents":
    parameters:
    - name: id
      in: path
      description: Compilation NOID
      required: true
      schema:
        type: string
    get:
      summary: Resolve a compilation into its current contents
      tags:
      - Compilations
      description: |
        Resolves the recipe against the live index: works beneath any
        included Collection (transitively, linked members included), plus
        individually included works, minus set-asides, minus tombstoned
        works — gated to what the caller may read (public, one of the
        caller's read or edit groups, the caller as an edit user, or the
        caller as the depositor; admins see everything). Solr-side
        pagination via `page` /
        `per_page` (default 25, capped at 100).
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Items per page, at most 100.
      responses:
        '200':
          description: pagination envelope (Solr-side start/rows)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompilationContents"
        '403':
          description: guest cannot resolve a private set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown noid
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: compilations_contents
  "/works/{id}/dwc":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a work's Darwin Core record
      tags:
      - Works
      description: |
        The Work's Darwin Core record. JSON by default: each term of the single
        dwr:SimpleDarwinRecord, keyed by its term name. Append `.xml`
        (/works/{id}/dwc.xml) for the stored Simple Darwin Core document,
        byte for byte, as a standalone download. Append `.html` for the display
        block, the counterpart of `/works/{id}/mods.html`: one `<section>` per
        TDWG class in the standard's order, each a `<dl>` labelled with the
        standard's term labels. Each `<dt>` names its term in `data-term`, so a
        consumer can override a label without matching its text. A term outside the standard renders under
        "Other terms", and a value listed with ` | ` renders one `<dd>` each.

        Gated like `/works/{id}/mods`: whoever may read the Work may read its
        record. 404 when the Work holds no record, including one that has been
        tombstoned, and for any NOID that is not a Work. The Work JSON's
        `metadata_formats` says whether to call this.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: darwin core returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkDarwinCore"
            application/xml:
              schema:
                "$ref": "#/components/schemas/WorkDarwinCore"
            text/html:
              schema:
                "$ref": "#/components/schemas/WorkDarwinCore"
        '404':
          description: the work holds no record, or the id is not a work
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: darwin_core_show
  "/resources/{id}/dwc":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    put:
      summary: Replace a work's Darwin Core record
      tags:
      - Resources
      description: |
        Replaces the Work's Darwin Core record with the supplied `binary`, a
        Simple Darwin Core XML document. PUT because the caller sends the whole
        document. The first PUT creates the record; a PUT onto a tombstoned
        record restores it. Each PUT appends an OCFL version.

        Atlas checks the shape only, and answers 422 with an `error` code when
        a rule fails: `malformed_xml` (not well-formed), `invalid_root` (the
        root is not dwr:SimpleDarwinRecordSet), `record_count` (not exactly one
        dwr:SimpleDarwinRecord) or `duplicate_term` (a term appears twice).
        Schema validation against tdwg_dwc_simple.xsd is the caller's. A
        request with no `binary` is a bare 422.

        Works only: any other NOID answers 404. Gated by `:update` on the Work.
        Writes an audit event with change type `metadata` and source `dwc`.
      parameters: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: Simple Darwin Core XML for the work
                origin:
                  type: string
                  description: Free-text tag naming the editing surface that produced
                    this MODS upload (Cerberus sends `metadata_form`, `advanced_form`
                    or `xml_editor`). Recorded verbatim on the audit event beside
                    `source`, truncated at 64 characters. Omit it and the event carries
                    no origin, which is what every event recorded before this field
                    looks like.
      responses:
        '200':
          description: darwin core replaced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkDarwinCore"
        '404':
          description: unknown id, or not a work
        '422':
          description: the document breaks a shape rule
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: darwin_core_update
    delete:
      summary: Tombstone a work's Darwin Core record
      tags:
      - Resources
      description: |
        Tombstones the record: `GET /works/{id}/dwc` answers 404 and the Work
        JSON drops `dwc` from `metadata_formats`. Nothing is purged. The
        preserved document and its version history stay, and the next PUT
        restores the record. 404 when the Work holds no record, and for any
        NOID that is not a Work. Gated by `:update` on the Work.
      responses:
        '204':
          description: record tombstoned
        '404':
          description: nothing to tombstone
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: darwin_core_destroy
  "/resources/{id}/dwc/versions":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List a work's Darwin Core version history
      tags:
      - Resources
      description: |
        Newest-first list of the retained Darwin Core versions, in the same
        shape as `/resources/{id}/mods/versions` and under the same admin gate,
        because the descriptors carry edit attribution. Attribution comes from
        the `dwc` audit events only. A Work with no record, or a NOID that is
        not a Work, yields `{ "versions": [] }`.
      responses:
        '200':
          description: versions listed (newest first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModsVersions"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: darwin_core_versions
  "/resources/{id}/dwc/versions/{version_id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    - name: version_id
      in: path
      description: OCFL version label, e.g. v3
      required: true
      schema:
        type: string
    get:
      summary: Fetch Darwin Core XML as of a specific version
      tags:
      - Resources
      description: |
        The stored dwc.xml as of the given OCFL version. XML only, because the
        JSON access copy is overwritten in place. Gated by `:read` on the Work.
        Unknown version, or no record ever written, answers 404.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content: {}
        '200':
          description: historical darwin core returned
        '404':
          description: unknown version
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: darwin_core_version
  "/delegates/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Delegate
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a Delegate
      tags:
      - Delegates
      description: |
        Returns a binary-less Delegate resource — carries the same
        structural metadata as a Blob (use, label, mime_type) plus a
        generic `uri` pointing at where the asset can be fetched
        (an IIIF URL for image roles).
      responses:
        '200':
          description: delegate found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Delegate"
        '410':
          description: 'tombstoned: the Delegate to admins and delegated admins, Tombstoned
            to everyone else'
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Delegate"
                - "$ref": "#/components/schemas/Tombstoned"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: delegates_show
  "/file_sets":
    get:
      summary: List file sets
      tags:
      - FileSets
      description: 'Lists every FileSet, one page at a time.

        '
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      responses:
        '200':
          description: file sets listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSetsIndex"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: file_sets_index
    post:
      summary: Create a file set
      tags:
      - FileSets
      description: |
        Creates a FileSet under a Work, classified by name (e.g. `generic`).

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created FileSet. 410 + tombstone payload if the
        underlying FileSet has been tombstoned in the interim.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      responses:
        '200':
          description: idempotent replay returns existing file set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '410':
          description: idempotent replay on a tombstoned file set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id:
                  type: string
                  description: NOID of the parent Work
                classification:
                  type: string
                  description: Classification name, e.g. generic
                position:
                  type: integer
                  description: Optional 1-based page order within the parent Work
                    (multipage Works). Omit for unordered FileSets.
              required:
              - work_id
              - classification
      operationId: file_sets_create
  "/file_sets/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the FileSet
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a file set
      tags:
      - FileSets
      description: |
        Returns a FileSet's record: its type, its position in the Work, and its
        state.

        A tombstoned FileSet answers `410`: an admin or delegated admin gets the
        full record, and everyone else gets the `Tombstoned` body.
      responses:
        '200':
          description: file set found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '410':
          description: 'tombstoned: the FileSet to admins and delegated admins, Tombstoned
            to everyone else'
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/FileSet"
                - "$ref": "#/components/schemas/Tombstoned"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: file_sets_show
    patch:
      summary: Append binary content to a file set
      tags:
      - FileSets
      description: |
        Attaches a binary as a Blob appended to the existing FileSet — the
        ordered/classified-slot attach used after `POST /file_sets` cuts the slot.

        Idempotent on the optional `Idempotency-Key` header: a repeat request
        from the same caller with the same key returns the FileSet with its
        already-attached Blob without re-uploading the bytes (410 + tombstone
        payload if the FileSet was tombstoned in the interim). Retains the v1
        `original_filename`, and verifies an optional `expected_digest`
        (`"<algorithm>:<hexvalue>"`), 422 on mismatch. An id that resolves to no
        FileSet is a 404.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing FileSet without
          recopying bytes.
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: Binary file to attach
                original_filename:
                  type: string
                  description: Preserved v1 filename, stored on the resulting Blob
                expected_digest:
                  type: string
                  description: Optional verify-on-ingest checksum, "<algorithm>:<hexvalue>".
                    422 on mismatch.
              required:
              - binary
      responses:
        '200':
          description: idempotent replay does not recopy bytes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '422':
          description: verify-on-ingest rejects a digest mismatch
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: file set not found
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: file_sets_update
    delete:
      summary: Destroy a file set
      tags:
      - FileSets
      description: |
        Permanently removes the FileSet, cascades into its Blobs, and removes
        the OCFL objects that hold the preserved bytes — every retained
        revision, not only the current one. Cannot be reversed. Rebuilds the
        parent Work's METS structMap without the removed pages.

        Admin only.
      responses:
        '204':
          description: file set destroyed
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: file_sets_destroy
  "/file_sets/{id}/iiif_service":
    parameters:
    - name: id
      in: path
      description: NOID of the FileSet
      required: true
      schema:
        type: string
    patch:
      summary: Attach the IIIF image-service Delegate URI to a file set
      tags:
      - FileSets
      description: |
        Upserts the per-page IIIF image-service pointer (`service_file`
        Delegate role) on the FileSet — the Cantaloupe base URI for the
        page's JP2, from which a viewer derives any size on demand via
        `info.json`. The Delegate nests in a `:derivative` FileSet under
        the page and surfaces in `GET /works/{id}/file_sets` for IIIF
        manifest assembly.

        Sibling of the Work-level `/thumbnails` and `/image_derivatives`
        endpoints, dispatched through DelegateUpdater: re-PATCHing never
        mints a duplicate Delegate, and a blank or missing `uri` is a
        no-op.
      parameters: []
      responses:
        '200':
          description: re-PATCHing upserts in place — one Delegate, latest URI
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FileSet"
        '404':
          description: unknown file set
        '409':
          description: optimistic-lock conflict survived the internal retry budget
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - uri
              properties:
                uri:
                  type: string
                  description: IIIF image-service base URI for the page's JP2
      operationId: file_sets_update_iiif_service
  "/file_sets/{id}/mets":
    parameters:
    - name: id
      in: path
      description: NOID of the FileSet
      required: true
      schema:
        type: string
    get:
      summary: Retrieve METS metadata for a file set
      tags:
      - FileSets
      description: Returns the JSON projection of the FileSet structural (METS) metadata.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: mets returned
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: file_sets_mets
  "/health":
    get:
      summary: Report whether Atlas can reach its dependencies
      tags:
      - Health
      operationId: health_show
      security: []
      description: |
        Readiness. Probes Postgres, Solr, the OCFL storage roots and the Redis
        cache, and names each one `ok` or `unavailable`. Unauthenticated, so the
        body carries no host names, versions or error text; the per-dependency
        detail goes to Atlas's log.

        Answers `503` when the database, the index or the storage is
        unavailable, and `200` otherwise. A cache outage alone leaves it `200`
        with `status: "degraded"`, because reads fall back to rendering. The
        result is memoized for five seconds per process, so polling it costs
        nothing.

        `GET /up` is the separate liveness route: it answers `200` once the app
        has booted and touches no dependency.
      responses:
        '200':
          description: every required dependency answers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '503':
          description: a required dependency is unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/maintenance":
    get:
      summary: Read the repository-wide read-only window
      tags:
      - Maintenance
      operationId: maintenance_show
      description: |
        The state of the repository-wide read-only window. On the authenticated
        read floor, and answered even while the window is open — a client that
        could not read the flag could not honour it.

        While `read_only` is true every write-shaped action is refused with a
        `503` carrying `error: "read_only_mode"` and a `Retry-After` header.
      responses:
        '200':
          description: window state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MaintenanceMode"
        '401':
          "$ref": "#/components/responses/Unauthorized"
  "/people":
    get:
      summary: List or batch-resolve people
      tags:
      - People
      description: |
        Without params: a paginated list of all Persons (`?page`, `?per_page`) —
        the NOID-keyed People-index source; each row carries the NOID (public
        address) plus the server-side nuid. With `?nuids=a,b,c`: batch-resolve to
        the authoritative display_name (supersedes the SSO users directory's
        name), dropping unresolved nuids — page size follows the match count.
        With `?q=fragment` (admin only): the Persons whose display_name contains
        the fragment, whose NUID starts with it, or whose account email contains
        it, all case-insensitive. Ordered by display_name and paginated over the
        matches, so `pagination` counts matches. A non-admin caller receives 403.
      parameters:
      - name: nuids
        in: query
        required: false
        description: Comma-separated NUIDs to batch-resolve
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: 'Typeahead fragment: display_name or email infix, NUID prefix
          (admin only)'
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Items per page, at most 100.
      responses:
        '200':
          description: search by q, paginated over the matches
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PeopleIndex"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: people_index
  "/people/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the person
      required: true
      schema:
        type: string
    get:
      summary: Fetch a person by NOID
      tags:
      - People
      description: 'Returns a Person''s record. An unknown NOID answers `404` with
        no body.

        '
      responses:
        '200':
          description: person found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
        '404':
          description: unknown noid
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: people_show
    patch:
      summary: Edit profile fields (system/admin, or the person themself)
      tags:
      - People
      description: |
        Edits display_name, bio and orcid. System and admin callers may edit any
        Person; a signed-in standard, loader or privileged user may edit the
        Person whose NUID matches their own. NUID is immutable and not patchable.
        Only the fields sent change. A blank display_name is refused
        (`blank_display_name`), as are a bio over 4,000 characters
        (`invalid_bio`) and an orcid that is not a valid bare ORCID iD
        (`invalid_orcid`); a blank bio or orcid clears it.
      parameters: []
      responses:
        '200':
          description: a person edits their own profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
        '403':
          description: a person cannot edit someone else's profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: an orcid that fails its checksum is refused
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown noid
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                bio:
                  type: string
                orcid:
                  type: string
      operationId: people_update
  "/resources/{id}/children":
    get:
      summary: A container's children, tombstoned ones included
      tags:
      - Resources
      description: |
        Every Community, Collection and Work directly beneath a Community or
        Collection, live or tombstoned, for inspecting the graph. Unlike
        `/collections/{id}/children` and `/communities/{id}/children`, it
        answers for a tombstoned container instead of 410. Each row has the
        `POST /resources/find_many` digest shape, `tombstoned` included.

        Admins and delegated admins only, the gate of
        `GET /resources/{id}/solr`. A delegated admin must also be able to read
        the container, and a child they cannot read is left out. Not
        response-cached.

        404 for an unknown NOID and for anything other than a Community or a
        Collection.
      parameters:
      - name: id
        in: path
        description: NOID of the Community or Collection
        required: true
        schema:
          type: string
      responses:
        '200':
          description: a live container lists live and tombstoned children alike
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResourceDigests"
        '404':
          description: a Work, which is not a container
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resource_children_show
  "/resources/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of a Work, Collection, Community, FileSet, Blob, Delegate
        or Person
      required: true
      schema:
        type: string
    get:
      summary: Resolve a resource by NOID
      tags:
      - Resources
      description: |
        Generic resolver. Issues a 302 redirect to the typed endpoint
        (e.g. /works/{id}). Resolves the Valkyrie-backed resource types only,
        so a Compilation NOID answers 404 here and is served by
        /compilations/{id} instead.
      responses:
        '302':
          description: redirect to typed resource
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_show
    delete:
      summary: Purge a resource
      tags:
      - Resources
      description: |
        Permanently removes the resource. This is a purge, not a tombstone: it
        deletes the metadata, cascades into members (a Work's FileSets and
        their Blobs), and removes the OCFL objects that hold the preserved
        bytes — every retained revision, not only the current one. Nothing
        survives but the audit row, which records the NOIDs it removed.

        Use `POST /resources/{id}/tombstone` for the reversible, user-visible
        removal. That one keeps everything and can be reversed.

        Refused with `422 has_children` while any Community, Collection or Work
        is still a member — and unlike tombstone it refuses a member that is
        merely tombstoned, because a purge cannot be undone and a member left
        behind is orphaned for good.

        Refused with `422 top_level_community` for a Community with no parent —
        the repository root or the People Community — whatever it holds. The
        API offers no way to remove a root.

        Admin only.
      responses:
        '204':
          description: resource purged
        '422':
          description: top-level community
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_destroy
  "/resources/{id}/permissions":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The NOID of the resource.
    get:
      summary: Permission flags for a resource
      tags:
      - Resources
      description: |
        The resource's own ACL envelope, gated on the caller's `:read` right
        over that resource rather than on the class — the envelope names the
        Grouper groups and the depositor's NUID, so handing it to a caller who
        may not read the resource would disclose the rights of something they
        cannot see.

        A caller refused the read gets **403** with the `{ error, action,
        subject }` ability envelope; an id that resolves to nothing gets
        **404**. The two are distinct at the wire, and a client is expected to
        keep them distinct: "may not see it" is a sign-in prompt, "is not
        there" is a dead link.
      responses:
        '200':
          description: permissions returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Permissions"
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '403':
          description: caller may not read the resource
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_permissions
    patch:
      summary: Adjust a resource's ACL
      tags:
      - Resources
      description: |
        Adjusts the resource's ACL. PATCH, and the verb is honoured per key: a
        key the payload omits keeps its stored value, and a key sent explicitly
        empty is cleared. So changing one slot needs no read-the-whole-envelope
        round trip. Accepts `embargo`, `depositor`, `proxy_uploader`,
        `edit_users`, `read` and `edit`; anything else is ignored.

        Two rules bound the write. A resource may be no more visible than its
        container, so a read audience wider than the parent's is refused with
        `422 visibility_exceeds_parent` (widen the parent instead). And a group
        grant may only be removed by a member of that group — admin and the
        devolved-admin tier excepted; a grant the caller cannot remove is
        preserved rather than rejected, so the stored ACL may retain groups the
        request omitted. Read it back with `GET /resources/{id}/permissions`.

        Type-agnostic, and the response is the resource in its own typed shape.
        Descriptive fields are not writable here — MODS has its own path.
      parameters: []
      responses:
        '200':
          description: acl adjusted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: object
                  properties:
                    embargo:
                      type: string
                      description: Release date, or empty to clear
                    depositor:
                      type: string
                    proxy_uploader:
                      type: string
                    edit_users:
                      type: array
                      items:
                        type: string
                    read:
                      type: array
                      items:
                        type: string
                    edit:
                      type: array
                      items:
                        type: string
              required:
              - permissions
        required: true
      operationId: resources_update_permissions
  "/resources/{id}/mods":
    parameters:
    - name: id
      in: path
      description: NOID of any Modsable resource (Work, Collection, Community)
      required: true
      schema:
        type: string
    get:
      summary: Retrieve current MODS metadata for any resource
      tags:
      - Resources
      description: |
        Type-agnostic current MODS: resolves the NOID and returns the resource's
        descriptive MODS without the caller knowing whether it is a Work,
        Collection, or Community. Output is byte-identical to the typed
        /works|collections|communities/{id}/mods routes (same views). Returns
        the JSON projection by default; append the .xml format suffix
        (/resources/{id}/mods.xml) for MODS XML. 404 for an unknown id, a
        non-Modsable resource, or one with no MODS.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: current mods returned
        '404':
          description: unknown id / non-Modsable / no MODS
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_mods
    put:
      summary: Replace a resource's MODS document
      tags:
      - Resources
      description: |
        Replaces the resource's descriptive metadata with the supplied `binary`
        MODS XML upload. PUT and not PATCH because the caller assembles the
        full document: descriptive merge logic lives in the client, e.g.
        Cerberus, not Atlas.

        Type-agnostic — the NOID is resolved and the write applies to a Work,
        Collection or Community alike. A type that holds no MODS answers 404,
        exactly as the GET on this path does. A request with no `binary`
        attached is a 422.

        Responds with the resource in its own typed shape, so the body matches
        what `GET /{type}/{id}` returns.
      parameters: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: MODS XML to apply to the resource
                origin:
                  type: string
                  description: Free-text tag naming the editing surface that produced
                    this MODS upload (Cerberus sends `metadata_form`, `advanced_form`
                    or `xml_editor`). Recorded verbatim on the audit event beside
                    `source`, truncated at 64 characters. Omit it and the event carries
                    no origin, which is what every event recorded before this field
                    looks like.
      responses:
        '200':
          description: mods replaced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: unknown id, or a type that holds no MODS
        '422':
          description: no document attached
        '409':
          description: optimistic-lock conflict (surfaced immediately, not retried)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_put_mods
  "/resources/{id}/mods/versions":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The NOID of the resource.
    get:
      summary: List MODS version history for a resource
      tags:
      - Resources
      description: |
        Reverse-chronological list of retained MODS versions for any Modsable
        resource (Work / Collection / Community). Each descriptor carries the
        OCFL version label and creation time, plus actor attribution correlated
        from the audit log (`actor_nuid` etc. are null when no edit event
        matches — e.g. the seed version a resource is born with).

        Admin-gated, like the File version list, because the descriptors expose
        edit attribution (the devolved-admin tier — :privileged role + the
        repository:admin group — can also reach this, as it can `/history`).
        A resource with no MODS yields `{ "versions": [] }`.
      responses:
        '200':
          description: versions listed (newest first)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ModsVersions"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_mods_versions
  "/resources/{id}/mods/versions/{version_id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The NOID of the resource.
    - name: version_id
      in: path
      description: OCFL version label, e.g. v1
      required: true
      schema:
        type: string
    get:
      summary: Fetch MODS XML as of a specific version
      tags:
      - Resources
      description: |
        Returns the raw historical descMetadata.xml as of the given OCFL
        version. XML only — the JSON access copy is overwritten in place and
        is not version-recoverable. Unknown version or absent MODS → 404.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content: {}
        '200':
          description: historical MODS XML returned
        '404':
          description: unknown version
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_mods_version
  "/resources/{id}/thumbnails":
    parameters:
    - name: id
      in: path
      description: NOID of the resource
      required: true
      schema:
        type: string
    patch:
      summary: Attach thumbnail-family IIIF Delegate URIs to a resource
      tags:
      - Resources
      description: |
        Upserts one or more thumbnail-tier Delegates — the 85px `thumbnail`,
        the 170px `thumbnail_2x`, and the 500px hero `preview`. Each non-blank
        URI is dispatched to its matching Role; a key you omit is left
        untouched.

        `preview_width`, `preview_height` and `preview_placeholder` describe
        the image `preview` serves, and are written only with it. A `preview`
        sent without them clears the stored ones, so a regenerated image never
        keeps the old image's size. Width and height travel together. The
        placeholder is base64 of a JPEG, at most 2048 characters.

        Purpose-specific: machine-set IIIF URLs, a fixed three-key shape, no
        user content. Type-agnostic, and the response is the resource in its
        own typed shape.

        Retry-safe: an optimistic-lock conflict is retried internally, and only
        an exhausted budget surfaces as `409 stale_resource`.
      parameters: []
      responses:
        '200':
          description: preview attached with its size and placeholder
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '422':
          description: preview size or placeholder malformed, or sent without the
            preview
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  description: IIIF URI for the ~85px square thumbnail
                thumbnail_2x:
                  type: string
                  description: IIIF URI for the ~170px square 2x thumbnail
                preview:
                  type: string
                  description: IIIF URI for the ~500px-wide preview
                preview_width:
                  type: integer
                  minimum: 1
                  description: Pixel width of the image `preview` serves
                preview_height:
                  type: integer
                  minimum: 1
                  description: Pixel height of the image `preview` serves
                preview_placeholder:
                  type: string
                  format: byte
                  maxLength: 2048
                  description: Base64 of a ~16px-wide JPEG of the preview image
      operationId: resources_update_thumbnails
  "/resources/{id}/parent":
    parameters:
    - name: id
      in: path
      description: NOID of the resource to move
      required: true
      schema:
        type: string
    patch:
      summary: Re-parent a resource
      tags:
      - Resources
      description: |
        Moves a resource under a different parent. A Work carries no ancestry
        field and has no descendants, so only its own membership changes; a
        container's moved subtree is re-projected synchronously. Permissions
        are untouched. Nothing moves to or from the top of the tree: a missing
        `parent_id` is a `422 parent_required`, and moving a Community that has
        no parent is a `422 top_level_community`.

        Authorization is TWO-SIDED — the caller needs `:reparent` on the moved
        node AND on the destination. Edit rights do not imply it for anyone but
        admin and the devolved-admin tier.

        A given-but-unresolvable `parent_id` is a `422 parent_not_found`, not a
        404: the parent is request input, not the addressed resource. A
        structurally invalid move (wrong parent type, a cycle, a tombstoned
        node or parent) is also a 422.
      parameters: []
      responses:
        '200':
          description: resource moved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: unknown id
        '422':
          description: no parent given
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  description: NOID of the destination
      operationId: resources_update_parent
  "/resources/{id}/tombstone":
    parameters:
    - name: id
      in: path
      description: NOID of the resource
      required: true
      schema:
        type: string
    post:
      summary: Tombstone a resource
      tags:
      - Resources
      description: |
        Tombstones the resource. Everything stays in storage and the tombstone
        is reversible via `POST /resources/{id}/restore`; reads answer `410`
        with a tombstoned stub. Use `DELETE /resources/{id}` for the
        irreversible purge.

        Refused with `422 top_level_community` for a Community with no parent —
        the repository root or the People Community. The API offers no way to
        tombstone a root.

        Refused with `422 has_live_children` while the resource still holds a
        live Community, Collection or Work, so a tombstone can never orphan a
        readable descendant — empty the tree leaf-first. A Work's FileSets and
        Blobs are not counted and ride along.

        Conflicts surface immediately as `409 stale_resource` rather than being
        retried: the caller decides whether a tombstone still applies.

        A FileSet is accepted too, and answers in the FileSet shape. It drops
        out of `GET /works/{id}/assets` and `/file_sets`, which is how a caption
        or other attached file is tombstoned reversibly. Admins and the
        devolved-admin tier only.

        `reason` is optional. When given, it must be one of the removal notes
        the library's removal policy allows, word for word, or the call
        answers `422 invalid_reason`. It is returned as `tombstone_reason`,
        recorded on the audit event and kept in the preservation envelope.
        It carries no date: a reader takes that from `tombstoned_at`.
      parameters: []
      responses:
        '200':
          description: resource tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '422':
          description: reason is not a policy removal note
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                  - Removed from view by legal order
                  - Removed from view at request of copyright holder
                  - Removed from view at Northeastern University's discretion
                  - Removed from view at Northeastern University Library's discretion
                  - Removed from view at contributor or content curator's discretion
      operationId: resources_tombstone
  "/resources/{id}/restore":
    parameters:
    - name: id
      in: path
      description: NOID of the resource
      required: true
      schema:
        type: string
    post:
      summary: Restore a tombstoned resource
      tags:
      - Resources
      description: |
        Reverses a tombstone: reads stop answering `410`, and
        `tombstone_reason` is cleared. Admin only. No confirmation marker —
        restoring is itself reversible, by tombstoning again.

        Refused with `422 tombstoned_parent` while the resource's parent is
        still tombstoned, so a restore can never surface a resource inside a
        tombstoned container — restore the tree root-first. A top-level
        Community has no parent and is never refused.

        The restored resource comes back no wider than its parent: its read
        groups are narrowed to their intersection with the parent's, and the
        restore's audit event records any narrowing as `read_before` and
        `read_after`. A FileSet reads through its Work and is not narrowed.
      responses:
        '200':
          description: resource restored
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '422':
          description: parent is still tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_restore
  "/resources/preview":
    post:
      summary: Render a temporary resource preview
      tags:
      - Resources
      description: Given raw MODS XML, renders an HTML preview without persisting.
        Used by the loader/editor surface.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                binary:
                  type: string
                  format: binary
                  description: MODS XML to preview
              required:
              - binary
      responses:
        '200':
          description: preview rendered
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_preview
  "/resources/find_many":
    post:
      summary: Resolve many resources by id in one round-trip
      tags:
      - Resources
      description: |
        Batch resolver. Takes a list of NOIDs and returns a lightweight digest
        per resolvable resource in a single index-backed query, collapsing a
        per-id find fan-out into one request.

        The result is **unordered** and **may be shorter than the input**:
        unresolvable ids are dropped silently. Tombstoned resources are kept
        but flagged (`tombstoned: true`) so callers can render a placeholder.
        Callers should index the result by `noid`.
      parameters: []
      responses:
        '200':
          description: empty id list returns an empty array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResourceDigests"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: NOIDs to resolve
              required:
              - ids
      operationId: resources_find_many
  "/resources/{id}/descendant_works":
    parameters:
    - name: id
      in: path
      description: NOID of any resource (subtree root)
      required: true
      schema:
        type: string
    get:
      summary: Every Work beneath a resource, flattened (gated, paginated)
      tags:
      - Resources
      description: |
        Resolves a resource's full descendant subtree to the Works it contains,
        at any depth — the structural counterpart to
        `GET /compilations/{id}/contents`. Same digest shape and query engine,
        but the container set is the resource's own subtree (self +
        `ancestor_ids_ssim` descendants) instead of a Set recipe.

        Gated per-Work to what the caller may read: public, one of the caller's
        read or edit groups, the caller as an edit user, or the caller as the
        depositor. Admins see everything. So a restricted Work never leaks via
        the subtree, and one the caller can edit is never hidden. Tombstoned
        works are dropped. Membership is **structural** (`a_member_of`) only;
        pass `include_linked=true` to also surface linked members
        (`a_linked_member_of`). Solr-side pagination via `page` / `per_page`
        (default 25, capped at 100). Unknown id → 404.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Items per page, at most 100.
      - name: include_linked
        in: query
        required: false
        description: Include linked members (a_linked_member_of); structural-only
          by default
        schema:
          type: boolean
      responses:
        '200':
          description: descendant works (transitively flattened, gated, paginated)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DescendantWorks"
        '404':
          description: unknown id
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: resources_descendant_works
  "/resources/search":
    get:
      summary: Search the catalog
      tags:
      - Resources
      description: |
        Keyword search over Works, Collections, Communities and People, ranked
        by relevance and read straight off Solr. The text is matched with the
        same field weights Cerberus's search bar uses, because both come from
        the Solr core's search handler.

        Results are gated to what the caller may read: public, one of the
        caller's read or edit groups, the caller as an edit user, or the caller
        as the depositor. Admins see everything. Tombstoned items, featured
        Collections, personal roots and the People Community never appear. An
        unfinished deposit appears only to its depositor and to staff.

        A blank `q` browses everything the caller may read, newest first.
        `type` narrows to one type. Pagination via `page` / `per_page`
        (default 25, capped at 100). An unknown `type` → 400.
      parameters:
      - name: q
        in: query
        required: false
        description: Search text. Omit to browse.
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Work
          - Collection
          - Community
          - Person
        description: Narrow to one type. Omit to search all four.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Items per page, at most 100.
      responses:
        '200':
          description: narrowed to one type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResults"
        '400':
          description: unknown type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: search_index
  "/users/by_nuid/{nuid}/accounts":
    get:
      summary: List the accounts sharing a NUID
      tags:
      - User
      description: |
        Every account sharing this NUID (a person's staff/student logins), each
        with email, affiliation label, role, stored group set, and the
        preferred flag. Discloses group sets, so it is limited to the person
        themselves, an admin, or the system principal; others receive 403.
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
        description: The person's NUID.
      responses:
        '200':
          description: accounts listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserAccounts"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: users_accounts
  "/users/by_nuid/{nuid}/preferred_account":
    put:
      summary: Set the preferred (default) account for a NUID
      tags:
      - User
      description: |
        Set the person's default account (drives the login choice when no
        account is named). Same self/admin/system scope as the accounts list.
        An email that is not one of this NUID's accounts → 404.
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
        description: The person's NUID.
      responses:
        '200':
          description: preferred account set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProvisionedUser"
        '404':
          description: email is not one of this NUID's accounts
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
      operationId: users_preferred_account
  "/users":
    get:
      summary: Search the user directory
      tags:
      - User
      description: |
        Read-only user directory. Two modes, same response shape:

        - `?q=<fragment>` — typeahead search: case-insensitive match on
          the account name or the curated Person `display_name`, prefix
          match on NUID. Capped at 10, ordered by the name an entry shows
          (`display_name` when set, else `name`).
        - `?nuids=a,b,c` — batch resolve (up to 100): exact NUIDs to
          entries; unknown NUIDs are dropped.

        Rows with role `anonymous`, `guest`, or `system` are never
        returned. With neither parameter the list is empty. Entries carry
        `nuid`, `name` and `display_name` only — a directory, not a profile
        endpoint. `display_name` is the Person's curated name, or null when
        the NUID has no Person.
      parameters:
      - name: q
        in: query
        required: false
        description: Name fragment (case-insensitive) or NUID prefix
        schema:
          type: string
      - name: nuids
        in: query
        required: false
        description: Comma-separated NUIDs to resolve in one call
        schema:
          type: string
      responses:
        '200':
          description: resolved directory entries (batch)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserDirectory"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: users_index
  "/users/by_nuid/{nuid}":
    get:
      summary: Resolve a NUID to a directory entry
      tags:
      - User
      description: |
        Single NUID to `{ nuid, name, display_name }`. Unknown NUIDs and rows with role
        `anonymous`, `guest`, or `system` both read as absent (404).
      parameters:
      - name: nuid
        in: path
        required: true
        schema:
          type: string
        description: The person's NUID.
      responses:
        '200':
          description: directory entry found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserDirectoryEntry"
        '404':
          description: unknown or excluded NUID
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: users_show
  "/user":
    get:
      summary: Current user details
      tags:
      - User
      description: |
        Returns the user resolved from the request auth context. With no
        valid Bearer/NUID, falls through to the guest user record. An optional
        `email` selects a specific one of the caller's other accounts under the
        same NUID (the switch flow); a foreign account is 403.
      parameters:
      - name: email
        in: query
        required: false
        description: Read a specific account under the caller's NUID (must be one
          of theirs).
        schema:
          type: string
      responses:
        '200':
          description: user returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: users_tokens_show
  "/works":
    get:
      summary: List works
      tags:
      - Works
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: The page to return, from 1. Follow `pagination.next` until it
          is null.
      - name: in_progress
        in: query
        required: false
        description: Filter by in_progress state. Omit for no filtering.
        schema:
          type: boolean
      - name: incomplete
        in: query
        required: false
        description: Filter by incomplete state. Omit for no filtering.
        schema:
          type: boolean
      description: |
        Paginated list of all works.

        Pass `?in_progress=true` to see only Works that Cerberus has not
        yet marked complete (operator-friendly "what's stuck?" view).
        Pass `?in_progress=false` to see only completed Works.

        Pass `?incomplete=true` for the other operator list: Works whose
        enrichment pipeline gave up after its retries (see
        `POST /works/{id}/incomplete`). The two filters are independent and
        combine, so `?in_progress=false&incomplete=true` reads as "finished,
        but degraded".
      responses:
        '200':
          description: the two filters combine — finished but degraded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorksIndex"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_index
    post:
      summary: Create a work
      tags:
      - Works
      description: |
        Creates a new Work as a child of the given Collection.

        The caller must hold edit rights on that Collection — a Grouper edit
        grant, or ownership of it (its `depositor`, which is what makes a
        deposit into one's own workspace work). Otherwise `403`.
        `collection_id` is required: a blank or unresolvable one is `404`.
        A tombstoned Collection refuses the create with `422
        tombstoned_parent`, after the edit-rights check.

        Idempotent on the optional `Idempotency-Key` header: a repeat
        request from the same caller with the same key returns the
        originally-created Work instead of creating a new one. If the
        underlying Work has since been tombstoned, the replay returns
        410 with the tombstone payload (same body shape as GET).
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Client-supplied UUID; repeats return the existing resource.
        schema:
          type: string
      responses:
        '200':
          description: idempotent replay returns existing work
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '410':
          description: idempotent replay on a tombstoned work
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '403':
          description: caller holds no edit rights on the parent Collection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: collection_id missing or unresolvable
        '422':
          description: the parent Collection is tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_id:
                  type: string
                  description: NOID of the parent Collection
                depositor:
                  type: string
                  description: NUID to stamp as the Work depositor (optional)
              required:
              - collection_id
      operationId: works_create
  "/works/{id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve a work
      tags:
      - Works
      description: |
        Returns a Work's record: its title and description, its ancestors, its
        thumbnails and its state. List its files with `GET /works/{id}/assets`.

        A tombstoned Work answers `410`: an admin or delegated admin gets the full
        record, and everyone else gets a stub. A purged NOID answers `410` with a
        stub that names the Work as purged, to every caller.
      responses:
        '200':
          description: ancestors flag the People Community and the personal root
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '410':
          description: 'tombstoned: the Work to admins and delegated admins, WorkTombstone
            to everyone else; purged: WorkPurged to everyone'
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Work"
                - "$ref": "#/components/schemas/WorkTombstone"
                - "$ref": "#/components/schemas/WorkPurged"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_show
  "/works/{id}/mods":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve MODS metadata for a work
      tags:
      - Works
      description: |
        Returns MODS XML by default; pass `Accept: application/json` for the
        JSON access copy, whose body is the `WorkMods` schema, or
        `Accept: text/html` for the rendered display.

        The HTML form marks each browse candidate with `data-browse-axis`
        (the MODS-side axis, never a Solr field name), `data-browse-value`
        (the exact indexed string, which is not always the rendered text) and
        `data-browse-authority` (the vocabulary the term came from, absent
        when the record declares none). A consumer turns a marked value into
        a search link; which axes it links is its own policy.
      responses:
        '200':
          description: mods returned
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_mods
  "/works/{id}/mets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Retrieve METS structural metadata for a work
      tags:
      - Works
      description: |
        JSON projection of the Work-level structural (METS) metadata. The
        physical structMap records page order (surfaced under mets.pages);
        it is built when the Work is completed (POST /works/:id/complete)
        and rebuilt eagerly on page changes thereafter. 404 for Works that
        have never been completed.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: work mets returned
        '404':
          description: work never completed — no METS yet
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_mets
  "/works/{id}/assets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List downloadable assets attached to a work
      tags:
      - Works
      description: |
        Returns a polymorphic array of downloadable assets attached to the
        Work: held binaries (Blob entries with size + original_filename)
        and external pointer-only derivatives (Delegate entries with
        use + uri, e.g. IIIF-served sized image variants). Thumbnails
        (Role.thumbnail_image) and metadata roles are excluded by
        Role.downloadable?.

        Each element names its model in `kind`, `Blob` or `Delegate`. Match on
        `kind`, not on whether `uri` is present: an embargo answers `uri: null`
        for a gated Delegate.

        A tombstoned Work answers `410 tombstoned` to everyone but admins and
        delegated admins, as do `/file_sets` and `/file_revisions`.
      responses:
        '410':
          description: work tombstoned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: the gate also surfaces on held Blob entries (original / pdf)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssets"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_assets
  "/works/{id}/tombstoned_assets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List the assets of a work's tombstoned FileSets
      tags:
      - Works
      description: |
        The assets of the Work's tombstoned FileSets, which `/works/{id}/assets`
        and `/works/{id}/file_sets` drop. Each entry has the `/assets` shape,
        including `file_set` — the id `POST /resources/{id}/restore` takes —
        plus that FileSet's `tombstoned_at` and `tombstoned_by`.

        Admin and devolved-admin tiers only, the tiers that may tombstone and
        restore a FileSet. Anyone else gets 403, including a user with edit
        rights on the Work. Not response-cached.
      responses:
        '200':
          description: tombstoned assets listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TombstonedAssets"
        '404':
          description: work not found
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_tombstoned_assets
  "/works/{id}/file_revisions":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List the revision dates of a work's replaced files
      tags:
      - Works
      description: |
        One entry per Blob on the Work that has been replaced at least once,
        each listing its content revisions newest first. A revision carries
        only its `revision` ordinal and its `created` date. The Blobs are the
        ones `/works/{id}/assets` lists, so tombstoned files stay out.

        Gated by `:read` on the Work, so anyone who can read the Work can read
        this. The attributed history, with actor, digest, size and filename,
        is `GET /files/{id}/versions` and stays admin-gated.

        A Work whose files were never replaced answers `[]`.
      responses:
        '200':
          description: no file was ever replaced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkFileRevisions"
        '404':
          description: work not found
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_file_revisions
  "/works/{id}/health_check":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: Grade a work's health green, yellow or red
      tags:
      - Works
      description: |
        Whether the Work is viable, needs repair, or has lost bytes. `green` is
        viable; `yellow` is broken or degraded with nothing lost, so it can be
        repaired in place; `red` has bytes missing or corrupt, so it needs a
        restore or a re-deposit. Each finding names its `severity` (`advisory`,
        `repairable`, `fatal`), a machine-readable `code`, and the NOID of the
        object it is about. The codes are an open vocabulary: show an unknown
        one rather than failing on it.

        The check reads Postgres, Solr and the Work's OCFL objects on disk. It
        never re-hashes the bytes, so `fixity_checked` is always false; fixity
        is the job of `atlas:health:work FIXITY=1` and `bin/ocfl-health`.

        `fixity` summarizes the checks a checker recorded through
        `POST /fixity_checks` over the objects the Work reaches. A Work is only
        as verified as its least recently checked object, so `last_checked_at`
        is the oldest of their latest checks, and null while any object has
        never been checked. `result` is the worst outcome recorded, or null
        when none has been.

        Admin and devolved-admin tiers only. Anyone else gets 403, including a
        user with edit rights on the Work. Not response-cached.
      responses:
        '200':
          description: health graded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkHealthCheck"
        '404':
          description: work not found
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_health_check
  "/works/{id}/file_sets":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List a work's page FileSets in order
      tags:
      - Works
      description: |
        Ordered page listing for multipage Works: one entry per page-bearing
        FileSet (descriptive/structural-metadata and derivative FileSets are
        excluded), sorted position ASC with unordered (null) FileSets last,
        creation-order tie-break. Each entry nests its downloadable assets —
        the page's content Blobs plus any per-page IIIF Delegates living in
        a derivative FileSet under the page. Unpaginated by design: manifest
        assembly needs the whole sequence in one read.
      responses:
        '200':
          description: assets stay grouped under their page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkFileSets"
        '404':
          description: work not found
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_file_sets
  "/works/{id}/image_derivatives":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Attach sized-image IIIF Delegate URIs to a work
      tags:
      - Works
      description: |
        Upserts one or more downloadable image-derivative Delegates on
        the Work — `small`, `medium`, and `large` IIIF URLs. Each
        non-blank URI is dispatched to DelegateUpdater against its
        matching Role (small_image / medium_image / large_image);
        missing keys are left untouched.

        Sibling of `/thumbnails`. These derivatives surface in
        `/works/{id}/assets` and are intended to be downloaded directly
        rather than rendered as UI chrome.
      parameters: []
      responses:
        '200':
          description: all three image-derivative keys land in one PATCH
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                small:
                  type: string
                  description: IIIF URL for the small image tier
                medium:
                  type: string
                  description: IIIF URL for the medium image tier
                large:
                  type: string
                  description: IIIF URL for the large image tier
      operationId: works_update_image_derivatives
  "/works/{id}/derivative_permissions":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Set a work's per-asset derivative-visibility policy
      tags:
      - Works
      description: |
        Replaces the Work's per-asset read policy for its downloadable renditions —
        which Grouper groups may fetch each binary. Two media families: the image
        ladder `small` / `medium` / `large` / `service` (deep-zoom) / `original` (the
        original image), and the independent media `audio` / `video` / `pdf`. Each
        tier is an array of read-group tokens (the resource vocabulary: `public`,
        Grouper group names, `[]` = private).

        Whole-object replace: the body is the complete policy; omitted tiers
        inherit by cascade WITHIN the image ladder (an absent tier inherits the
        next lower-resolution tier; `small` inherits the Work). Independent media
        do not cascade — an absent `audio`/`video`/`pdf` key rides the Work.
        Invariants are enforced (422 on violation): a tier may not be more visible
        than the Work (`tier_exceeds_resource`); within the image ladder visibility
        must narrow as resolution grows —
        `original` ⊆ `service` ⊆ `large` ⊆ `medium` ⊆ `small` (`tier_ordering_violation`;
        independent media impose no ordering); an unrecognized tier key is
        `unknown_tier`.

        The gate is advisory — Cerberus and the IIIF auth layer enforce it (image
        tiers via signed IIIF URLs, held binaries via Cerberus's download :read
        check). The effective per-asset gate surfaces on `GET /works/{id}/assets`
        (`gated` / `permission`) for both Delegate and Blob entries, and the stored
        map echoes back under `derivative_permissions`.
      parameters: []
      responses:
        '200':
          description: accepts the per-classification tiers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '422':
          description: an unknown tier key is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: optimistic-lock conflict surfaces (permission edits are not
            retried)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                small:
                  type: array
                  items:
                    type: string
                  description: Read groups for the small image tier
                medium:
                  type: array
                  items:
                    type: string
                  description: Read groups for the medium image tier
                large:
                  type: array
                  items:
                    type: string
                  description: Read groups for the large image tier
                service:
                  type: array
                  items:
                    type: string
                  description: Read groups for the service (deep-zoom) image tier
                original:
                  type: array
                  items:
                    type: string
                  description: Read groups for the original image — the image-ladder
                    floor. `master` is accepted as an alias for one release and stored
                    as `original`
                audio:
                  type: array
                  items:
                    type: string
                  description: Read groups for audio renditions (independent)
                video:
                  type: array
                  items:
                    type: string
                  description: Read groups for video renditions (independent)
                pdf:
                  type: array
                  items:
                    type: string
                  description: Read groups for PDF renditions (independent)
                archive:
                  type: array
                  items:
                    type: string
                  description: Read groups for zip and tar files (independent)
                spreadsheet:
                  type: array
                  items:
                    type: string
                  description: Read groups for Excel files (independent)
                structured_text:
                  type: array
                  items:
                    type: string
                  description: Read groups for CSV, TSV, XML and JSON files (independent)
                presentation:
                  type: array
                  items:
                    type: string
                  description: Read groups for PowerPoint files (independent)
                text:
                  type: array
                  items:
                    type: string
                  description: Read groups for Word, EPUB and plain-text files (independent)
                generic:
                  type: array
                  items:
                    type: string
                  description: Read groups for any other file (independent). Captions
                    are never tiered; they follow the Work
      operationId: works_update_derivative_permissions
  "/works/{id}/full_text":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    patch:
      summary: Store a work’s derived full-document text
      tags:
      - Works
      description: |
        Stores the Work-level aggregate of Cerberus-extracted document text as
        the Work's derived `full_text` attribute. FullTextIndexer projects it
        onto the Work's Solr doc as the dedicated `full_text_tesimv` field for
        body-text search and the "Full Text Match" snippet.

        Same "machine-set derived metadata" seam as `/thumbnails` — a
        regenerable search aid re-sent on any re-ingest, never user-authored.
        Cerberus's FullTextExtractionJob is the primary caller. The response
        omits the text (a long PDF is MBs); it's read back only through Solr.
      parameters: []
      responses:
        '200':
          description: full text stored and projected to full_text_tesimv
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Extracted plain text (Work-level aggregate of content
                    FileSets)
              required:
              - text
      operationId: works_update_full_text
  "/works/{id}/linked_members":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List the collections a work is linked into
      tags:
      - Works
      description: |
        Returns the NOIDs of the Collections this Work is a *linked* member of
        (the DAG overlay — additional placements beyond its one structural
        home). Powers Cerberus's provenance panel. Does not include the
        structural parent (that's `a_member_of`, surfaced via ancestors).
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: linked collections listed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_linked_members
    post:
      summary: Link a work into an additional collection
      tags:
      - Works
      description: |
        Adds the Work as a linked member of the target Collection — placement
        only, never a permission change. Admin-only for edit-rights holders:
        linking a Work into additional Collections is a structural mutation of
        the content graph, so edit rights are not sufficient. The :system
        principal has one narrow exception (Cerberus's "Publish to my
        community" deposit flow): given an `On-Behalf-Of` header naming the
        Work's own depositor, it may link that Work into a *featured* showcase
        Collection only. Rejects a non-Collection target, a tombstoned
        work/target, and a target that is already the Work's structural home,
        with a 422. Returns the updated list of linked collection NOIDs.
      parameters: []
      responses:
        '200':
          description: work linked into the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '422':
          description: rejects a non-Collection target
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - collection_id
              properties:
                collection_id:
                  type: string
                  description: NOID of the Collection to link into
      operationId: works_add_linked_member
  "/works/{id}/linked_members/{collection_id}":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    - name: collection_id
      in: path
      description: NOID of the linked Collection to remove
      required: true
      schema:
        type: string
    delete:
      summary: Unlink a work from a collection
      tags:
      - Works
      description: |
        Removes a linked membership (idempotent — removing an absent link is a
        no-op). Same authorization as the add (admin, or :system scoped to its
        own on_behalf_of depositor plus a featured Collection). Returns the
        updated list of linked collection NOIDs. Permissions are never changed.
      responses:
        '200':
          description: work unlinked from the collection
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_remove_linked_member
  "/works/{id}/associations":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    get:
      summary: List a work's associations
      tags:
      - Works
      description: |
        Returns the typed relationships between this Work and other Works
        (DRS v1's "associated works"), read from both ends and keyed by
        predicate.

        `outbound` is what this Work asserts — "I am the codebook for that
        dataset". `inbound` is what other Works assert about it — "those
        Works say they are figures for me". The edge is stored once, on the
        asserting Work; the inbound direction is derived, never stored, so
        the two can never disagree. Predicates with no edges are omitted.

        The five predicates are `is_codebook_for`, `is_figure_for`,
        `is_instructional_material_for`, `is_supplemental_material_for` and
        `is_transcription_of`.

        Not part of the Work show payload — fetch it here when you need it.
      responses:
        '410':
          description: withheld by a tombstone from everyone but admins and delegated
            admins
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tombstoned"
        '200':
          description: associations listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssociations"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_associations
    post:
      summary: Associate a work with another work
      tags:
      - Works
      description: |
        Asserts a typed, directed relationship from this Work to another —
        "this is the codebook for that dataset". Both Works stay separate
        records; nothing moves in the containment tree and no ACL changes.

        The edge is stored only on this Work. `GET` on the target reports the
        same edge under `inbound`, so there is no reciprocal edge to keep in
        step.

        Asserting an edge that already exists is a no-op. Two Works can hold
        several different edges at once.

        A cycle is permitted and meaningful: "A is a transcription of B" and
        "B is a figure for A" can both be true.

        Admin and devolved-admin only. The assertion renders on the target's
        page too, and the asserter may hold no rights over it, so this is an
        operator action rather than an edit-rights one.
      parameters: []
      responses:
        '200':
          description: work associated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssociations"
        '422':
          description: rejects an unknown relationship type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - work_id
              - type
              properties:
                work_id:
                  type: string
                  description: NOID of the Work this one is subordinate to
                type:
                  type: string
                  description: One of the five relationship predicates
                  enum:
                  - is_codebook_for
                  - is_figure_for
                  - is_instructional_material_for
                  - is_supplemental_material_for
                  - is_transcription_of
      operationId: works_add_association
  "/works/{id}/associations/{type}/{work_id}":
    parameters:
    - name: id
      in: path
      description: NOID of the asserting Work
      required: true
      schema:
        type: string
    - name: type
      in: path
      description: The relationship predicate to retract
      required: true
      schema:
        type: string
    - name: work_id
      in: path
      description: NOID of the associated Work
      required: true
      schema:
        type: string
    delete:
      summary: Remove an association between two works
      tags:
      - Works
      description: |
        Retracts one typed relationship. Idempotent — retracting an edge that
        was never asserted is a no-op.

        The type is in the path rather than a query parameter because it is
        part of the edge's identity: retracting the figure claim leaves a
        transcription claim between the same two Works standing.

        Same authorization as the POST (admin and devolved admin). Returns
        the updated associations from both ends.
      responses:
        '200':
          description: association removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WorkAssociations"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_remove_association
  "/works/{id}/complete":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The NOID of the resource.
    post:
      summary: Mark a work complete
      tags:
      - Works
      description: |
        Flips `in_progress` to false. Cerberus calls this after its
        per-record Solid Queue job confirms all expected children
        (FileSets / Blobs) are deposited. Idempotent — calling on an
        already-complete Work simply re-saves with in_progress: false.
      responses:
        '200':
          description: completing builds the Work-level METS structMap
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '409':
          description: optimistic-lock conflict survived the internal retry budget
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_complete
  "/works/{id}/incomplete":
    parameters:
    - name: id
      in: path
      description: NOID of the Work
      required: true
      schema:
        type: string
    post:
      summary: Flag a work whose pipeline gave up
      tags:
      - Works
      description: |
        Sets `incomplete` to true and records `incomplete_reason`. Cerberus
        calls this from a work-scoped job's give-up handler — the PDF or media
        rendition, the derivatives, the full-text extraction — once that job
        has exhausted its retries.

        This state **flags; it never hides**. A Work with its file, title and
        metadata but one missing derivative is degraded, not broken, and stays
        readable. `MODSIndexer` projects both fields onto the Work's Solr
        document (`incomplete_bsi`, `incomplete_reason_ssi`) so a result row
        can render a pill without a per-row fetch.

        `reason` is a machine token (`pdf_rendition_gave_up`,
        `media_rendition_gave_up`, `ingest_gave_up`, …). Atlas stores it as an
        opaque string and does **not** validate it against a list: the
        vocabulary belongs to the caller, so a new token must not need an
        Atlas release. A blank or absent reason still sets the flag — the
        caller is a job already on its failure path.

        Idempotent; the last reason wins. `DELETE` on the same path clears
        both fields when a later run of the job succeeds.
      parameters: []
      responses:
        '200':
          description: a body-less call still sets the flag, with a null reason
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: no such work
        '409':
          description: optimistic-lock conflict survived the internal retry budget
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Machine token naming the cause (e.g. pdf_rendition_gave_up)
      operationId: works_mark_incomplete
    delete:
      summary: Clear the incomplete flag
      tags:
      - Works
      description: |
        Clears `incomplete` and `incomplete_reason` together. Cerberus calls
        this when a later run of the same job succeeds, which makes the state
        self-healing; an operator repairing a Work by hand can call it too.

        Idempotent — clearing a Work that was never flagged is a no-op.
      responses:
        '200':
          description: clearing a work that was never flagged is a no-op
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Work"
        '404':
          description: no such work
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: works_clear_incomplete
