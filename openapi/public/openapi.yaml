        stamped from the authenticated NUID). Born private: empty ACLs, no staff default.'
      parameters: []
      responses:
        '201':
          description: compilation created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '403':
          description: guest cannot create
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: missing title
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
