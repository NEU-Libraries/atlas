    WorkHealthCheck:
      type: object
      required:
      - noid
      - grade
      - fixity_checked
      - fixity
      - findings
      properties:
        noid:
          type: string
        grade:
          type: string
          enum:
          - green
          - yellow
          - red
          description: green viable; yellow repairable, nothing lost; red bytes lost
        fixity_checked:
          type: boolean
          description: 'Always false: this endpoint never re-hashes the bytes'
        fixity:
          type: object
          properties:
            last_checked_at:
              type: string
              format: date-time
              nullable: true
              description: The oldest latest check among the objects; null while any
                is unchecked
            result:
              type: string
              enum:
              - pass
              - fail
              nullable: true
              description: The worst recorded outcome among the objects, or null when
                none is recorded
            objects:
              type: integer
              description: The OCFL objects the Work reaches
            never_checked:
              type: integer
              description: Objects with no recorded check
          required:
          - last_checked_at
          - result
          - objects
          - never_checked
        findings:
          type: array
          items:
            type: object
            required:
            - severity
            - code
            - subject
            - message
            properties:
              severity:
                type: string
                enum:
                - advisory
                - repairable
                - fatal
              code:
                type: string
                description: Machine-readable finding, such as mods_xml_missing
              subject:
                type: string
                description: NOID of the object the finding is about
              message:
                type: string
    Error:
      type: object
      description: The body of every error that has one. Branch on `error`, never
        on `message`.
      properties:
        error:
          type: string
          description: 'What went wrong. A code such as `stale_resource` (409), `tombstoned`
            (410), `invalid_record` (422), `read_only_mode` (503) or `backend_unavailable`
            (503), or the code of a rejected write such as `invalid_parent_type` (422).
            On a 400, 401 or 403 it is a sentence for a person, not a code: branch
            on the status instead.'
        code:
          type: string
          description: 'On some 422s, such as `has_children` or `tombstoned_parent`:
            the code, while `error` carries a sentence.'
        message:
          type: string
          description: Detail for a person. Never parse it.
        resource_id:
          type: string
          nullable: true
          description: The NOID the request named.
        action:
          type: string
          description: 'On a 403: the verb that was refused.'
        subject:
          type: string
          description: 'On a 403: the type of the resource the verb was refused on.'
        dependency:
          type: string
          enum:
          - database
          - index
          - storage
          - cache
          description: 'On `backend_unavailable`: the dependency Atlas could not reach.'
        tombstoned_resource_id:
          type: string
          description: 'On `tombstoned`: the NOID of the tombstoned resource, which
            can be an ancestor of the one requested.'
        tombstoned_resource_type:
          type: string
          description: 'On `tombstoned`: the type of the tombstoned resource.'
      required:
      - error
      additionalProperties: false
    Pagination:
      type: object
      description: Where this page sits in the list. Follow `next` until it is null.
      properties:
        count:
          type: integer
          description: Items in the whole list.
        page:
          type: integer
          description: This page's number, from 1.
        items:
          type: integer
          description: The page size.
        pages:
          type: integer
          description: Pages in the whole list.
        last:
          type: integer
          description: The last page's number.
        in:
          type: integer
          description: Items on this page.
        from:
          type: integer
          description: The position of this page's first item, from 1; 0 on an empty
            list.
        to:
          type: integer
          description: The position of this page's last item.
        prev:
          type: integer
          nullable: true
          description: The previous page's number, or null on the first page.
        next:
          type: integer
          nullable: true
          description: The next page's number, or null on the last page.
        series:
          type: array
          items:
            oneOf:
            - type: integer
            - type: string
          description: 'Pages to show in a pager: a number for another page, this
            page''s number as a string, and `gap` for elided pages.'
        scaffold_url:
          type: string
          description: This request's path with `__pagy_page__` in place of the page
            number.
        first_url:
          type: string
          description: The path of the first page.
        prev_url:
          type: string
          description: The path of the previous page. On the first page it ends `page=`
            with no number.
        page_url:
          type: string
          description: The path of this page.
        next_url:
          type: string
          description: The path of the next page. On the last page it ends `page=`
            with no number.
        last_url:
          type: string
          description: The path of the last page.
        vars:
          type: object
          additionalProperties: true
          description: The paginator's internal settings. Not part of the contract.
      required:
      - count
      - page
      - items
      - pages
      - last
      - in
      - from
      - to
      - prev
      - next
      - series
      - scaffold_url
      - first_url
      - prev_url
      - page_url
      - next_url
      - last_url
      - vars
    SearchPagination:
