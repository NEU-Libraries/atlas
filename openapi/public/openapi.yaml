        type: string
    delete:
      summary: Remove an included Work
      tags:
      - Compilations
      description: 'Idempotent: removing an absent inclusion is a 200 no-op.'
      responses:
        '200':
          description: inclusion removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      operationId: compilations_remove_included_work
  "/compilations/{id}/exclusions":
    parameters:
    - name: id
