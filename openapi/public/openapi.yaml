            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: non-owner cannot mutate the recipe
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_id:
                  type: string
                  description: Collection NOID
              required:
