    post:
      summary: Include a Collection (transitive)
      tags:
      - Compilations
      description: Adds an include-collection recipe line. The noid must resolve to
        a Collection (Communities and unknown noids are 422). Idempotent. No audit
        row — recipe churn is personal curation.
      parameters: []
      responses:
        '200':
          description: collection included (idempotent)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Compilation"
        '422':
