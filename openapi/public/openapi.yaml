---
openapi: 3.0.3
info:
  title: Atlas API
  version: '1'
  description: |
    Atlas is the API for the Northeastern University Library digital
    repository (the DRS). It holds the repository's content: the tree of
    Communities, Collections and Works, their descriptive metadata, and their
    files.

    This document is served at `/api-docs/openapi.yaml`, and rendered for
    people at `/docs`.

    ### Getting access

    Without a credential, you are a **guest**. A guest can read public items
    only, and cannot write.

    To read more, or to write, ask the repository operator for a personal
    access token. Send it on every request as `Authorization: Bearer <token>`.
    A token lasts one week, and can be issued read-only. When it expires or
    is revoked, Atlas answers `401`; ask the operator for a new one.

    What a token lets you do depends on the permissions of the user it names.
    An operation that needs more than read access says so in its description.

    ### Errors

    Read the status code first. Every `4xx` and `5xx` that has a body uses
    the `Error` schema, and a client branches on its `error` key, never on
    `message`. Most `404` responses have no body at all.

    Two exceptions are documented where they occur. On some `422` responses,
    `error` is a sentence and the code is in `code`. And a tombstoned
    resource's own record answers `410` with the record, or a stub of it,
    rather than an `Error`.

    Three statuses apply to every operation, so they are not repeated on each
    one:

    - **`503` with `error: "backend_unavailable"`.** Atlas cannot reach a
      dependency. The `dependency` key names it. Wait for the `Retry-After`
      seconds, then retry.
    - **`503` with `error: "read_only_mode"`** on any write. The repository
      is in a maintenance window. `Retry-After` is the expected wait in
      seconds, and can be long; `GET /maintenance` reports the window.
    - **Any `5xx`** (see the `ServerError` response). A proxy in front of
      Atlas can answer `502` or `504` with a body that is not JSON.

    ### Paging

    A list returns one page and a `pagination` block. Ask for another page
    with `?page=<n>`. Lists that take `per_page` cap it at 100.

    The block has one of two shapes. Most lists return `Pagination`: stop
    when `pagination.next` is null. The search-backed lists (search,
    descendant Works and a Compilation's contents) return `SearchPagination`:
    stop when `pagination.page` reaches `pagination.pages`.

    ### Terms

    | Term | Meaning |
    |---|---|
    | NOID | The identifier of a resource in this API: a short, opaque string. Every `id` in a path is a NOID. |
    | NUID | A Northeastern University ID, the 9-digit number that names a person. |
    | Handle | The persistent identifier of a finished Work. It resolves through `https://hdl.handle.net`. |
    | MODS | The library XML standard for descriptive metadata. Atlas keeps each resource's MODS as the preservation copy and serves a JSON reading of it. |
    | METS | The XML standard that describes a Work's files and their structure. |
    | Darwin Core | A metadata standard for biological specimens. A Work can hold one Darwin Core record beside its MODS. |
    | IIIF | The International Image Interoperability Framework. An image FileSet can name a IIIF image service. |
    | Grouper | Northeastern's group directory. A read or edit grant can name a Grouper group as well as a user. |
    | Tombstone | A resource withdrawn from view. Its record stays, but its content is withheld, and reads answer `410`. |
    | Embargo | A date before which a Work's files are withheld from everyone but administrators and repository staff. The Work's record stays readable. |
    | Delegated admin | A user who holds the privileged role and belongs to the admin group. They can restore, reparent and audit, but do not have the full admin role. |
servers:
- url: "{scheme}://{host}"
  variables:
    scheme:
      default: https
      enum:
      - https
      - http
    host:
      default: atlas.library.northeastern.edu
security:
- BearerAuth: []
- {}
tags:
- name: Communities
  description: |-
    The top level of the tree. A Community holds Collections and other Communities.

    Background: [resource-graph.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/resource-graph.md).
- name: Collections
  description: |-
    A Collection holds Works and other Collections.

    Background: [resource-graph.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/resource-graph.md).
- name: Works
  description: |-
    A Work is one deposited item: its metadata, its files and its state.

    Background: [mods.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/mods.md).
- name: FileSets
  description: |-
    A FileSet groups the files of one asset of a Work, such as a page image and its derivatives.

    Background: [binaries.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/binaries.md).
- name: Files
  description: |-
    A file is a Blob: one versioned binary in preservation storage.

    Background: [binaries.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/binaries.md).
- name: Resources
  description: |-
    Operations that apply to any resource in the tree, whatever its type.

    Background: [resource-graph.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/resource-graph.md).
- name: Delegates
  description: |-
    A Delegate points at a derivative that Atlas does not store, such as an image size served by a IIIF server.

    Background: [binaries.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/binaries.md).
- name: Compilations
  description: |-
    A Compilation is a personal Set of Works and Collections.

    Background: [compilations.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/compilations.md).
- name: People
  description: |-
    A Person is a curatorial identity: a name, a profile and affiliations.

    Background: [people.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/people.md).
- name: User
  description: |-
    The calling user, their accounts and the user directory.

    Background: [authentication.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/authentication.md).
- name: Maintenance
  description: |-
    Whether the repository is in a read-only maintenance window.

    Background: [availability.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/availability.md).
- name: Health
  description: |-
    Whether Atlas can reach its dependencies.

    Background: [availability.md](https://github.com/NEU-Libraries/atlas/blob/develop/docs/availability.md).
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: A personal access token issued by the repository operator. Omit
        the header to call as a guest, who sees public items only.
  responses:
    Unauthorized:
      description: 'The credential was not recognised: an unknown, expired or revoked
        token. Send no `Authorization` header to call as a guest instead.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ServerError:
      description: Atlas, or a proxy in front of it, failed to serve the request.
        Applies to every operation. Atlas's own 5xx carries an `Error` body; a proxy's
        502 or 504 can carry HTML or plain text, so read the status before you parse
        the body.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Work:
      type: object
      properties:
        work:
          type: object
          properties:
            id:
              type: string
              description: NOID
            valkyrie_id:
              type: string
              description: Valkyrie internal id
            ancestors:
              type: array
              description: Ancestor chain, root-first, with titles and structural
                flags — array of {noid, klass, title, system_container, personal_root}
                objects
              items:
                type: object
                properties:
                  noid:
                    type: string
                    description: Ancestor NOID
                  klass:
                    type: string
                    description: Ancestor resource class name
                  title:
                    type: string
                    description: Ancestor plain-text title (may be empty)
                  system_container:
                    type: boolean
                    description: True for the People system Community. Always false
                      for a non-Community.
                  personal_root:
                    type: boolean
                    description: True for a Person's personal-root Collection. Always
                      false for a non-Collection.
                required:
                - noid
                - klass
                - title
                - system_container
                - personal_root
            thumbnail:
              type: string
              nullable: true
              description: IIIF URL of the :thumbnail_image Delegate (~85px), or null
            thumbnail_2x:
              type: string
              nullable: true
              description: IIIF URL of the :thumbnail_image_2x Delegate (~170px retina),
                or null
            preview:
              type: string
              nullable: true
              description: IIIF URL of the :preview_image Delegate (~500px hero),
                or null
            preview_width:
              type: integer
              nullable: true
              description: Pixel width of the image `preview` serves, or null
            preview_height:
              type: integer
              nullable: true
              description: Pixel height of the image `preview` serves, or null
            preview_placeholder:
              type: string
              nullable: true
              format: byte
              description: Base64 of a ~16px-wide JPEG of the preview image, for a
                blurred stand-in, or null
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            permanent_url:
              type: string
              nullable: true
            tombstoned:
              type: boolean
              description: Tombstoned (suppressed from discovery) flag
            tombstoned_at:
              type: string
              nullable: true
              description: ISO-8601 timestamp set when tombstoned
            tombstoned_by:
              type: string
              nullable: true
              description: NUID of the user who tombstoned the resource
            tombstone_reason:
              type: string
              nullable: true
              enum:
              - Removed from view by legal order
              - Removed from view at request of copyright holder
              - Removed from view at Northeastern University's discretion
              - Removed from view at Northeastern University Library's discretion
              - Removed from view at contributor or content curator's discretion
              description: The policy removal note chosen at tombstoning, or null.
                The date comes from tombstoned_at.
            depositor:
              type: string
              nullable: true
              description: NUID of the intellectual owner (the named depositor; may
                differ from the hands-on-keyboard actor). Null for a guest.
            proxy_uploader:
              type: string
              nullable: true
              description: NUID of the hands-on-keyboard actor for the most-recent
                create. Equals depositor for self-deposit; differs in the librarian-on-behalf
                (proxy-deposit) case. Left null under acting-as impersonation (On-Behalf-Of
                header present) — the operator is recorded only in the AuditEvent,
                not on the resource. Null for a guest.
            in_progress:
              type: boolean
              description: Cerberus-driven workflow flag; true until the bulk-deposit
                job marks the Work complete.
            incomplete:
              type: boolean
              description: Pipeline-failure flag; true when a work-scoped enrichment
                job gave up after its retries. Flags only — the Work stays readable.
            incomplete_reason:
              type: string
              nullable: true
              description: Machine token naming the cause (e.g. pdf_rendition_gave_up).
                Opaque to Atlas and unvalidated; the vocabulary belongs to the caller.
                Null unless the Work is flagged.
            handle:
              type: string
              nullable: true
              description: Persistent identifier, "<prefix>/<noid>", minted against
                the Handle service when the Work is finalized. Null until then, and
                on any deployment with no handle server configured.
            derivative_permissions:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: 'Per-asset derivative read policy: sparse map of tier =>
                [read groups]. Image ladder small/medium/large/service/original plus
                independent tiers audio/video/pdf/archive/spreadsheet/structured_text/presentation/text/generic.
                Empty when unset (tiers inherit the Work visibility). For a guest
                each tier keeps only `public`, so a reserved tier reads [].'
            metadata_formats:
              type: array
              items:
                type: string
                enum:
                - dwc
              description: The additional metadata records the Work holds, e.g. "dwc"
                for Darwin Core. Empty when it holds none. MODS and METS are never
                listed.
          required:
          - id
          - valkyrie_id
          - ancestors
          - thumbnail
          - thumbnail_2x
          - preview
          - preview_width
          - preview_height
          - preview_placeholder
          - title
          - description
          - permanent_url
          - tombstoned
          - tombstoned_at
          - tombstoned_by
          - tombstone_reason
          - depositor
          - proxy_uploader
          - in_progress
          - incomplete
          - incomplete_reason
          - handle
          - derivative_permissions
          - metadata_formats
      required:
      - work
